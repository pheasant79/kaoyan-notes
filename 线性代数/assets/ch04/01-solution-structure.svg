<svg xmlns="http://www.w3.org/2000/svg" width="980" height="270" viewBox="0 0 980 270" role="img" aria-labelledby="title desc">
  <title id="title">线性方程组解结构判断</title>
  <desc id="desc">由 Ax=b 出发，比较系数矩阵和增广矩阵的秩，判断无解、唯一解或无穷多解。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker></defs>
  <rect width="980" height="270" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="35" y="82" width="150" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="110" y="124" font-size="22" fill="#1E3A8A">Ax = b</text>
    <line x1="188" y1="118" x2="276" y2="118" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="279" y="82" width="190" height="72" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="374" y="112" font-size="18" fill="#166534">增广矩阵消元</text><text x="374" y="137" font-size="14" fill="#475569">求 r(A) 与 r(A|b)</text>
    <line x1="472" y1="118" x2="552" y2="118" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="555" y="82" width="160" height="72" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="635" y="112" font-size="18" fill="#334155">比较秩</text><text x="635" y="137" font-size="14" fill="#475569">相等还是不等</text>
    <line x1="635" y1="157" x2="635" y2="192" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="635" y1="192" x2="205" y2="192" stroke="#64748B" stroke-width="2"/>
    <line x1="635" y1="192" x2="810" y2="192" stroke="#64748B" stroke-width="2"/>
    <line x1="205" y1="192" x2="205" y2="210" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="192" x2="450" y2="210" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="810" y1="192" x2="810" y2="210" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="70" y="212" width="270" height="42" rx="7" fill="#FEF2F2" stroke="#DC2626"/><text x="205" y="238" font-size="16" fill="#991B1B">r(A) &lt; r(A|b)：无解</text>
    <rect x="350" y="212" width="200" height="42" rx="7" fill="#F0FDF4" stroke="#16A34A"/><text x="450" y="238" font-size="16" fill="#166534">相等且 r=n：唯一解</text>
    <rect x="600" y="212" width="420" height="42" rx="7" fill="#FDF4FF" stroke="#9333EA"/><text x="810" y="238" font-size="16" fill="#7E22CE">相等且 r&lt;n：无穷多解</text>
  </g>
</svg>
