<svg xmlns="http://www.w3.org/2000/svg" width="720" height="398" viewBox="0 0 720 398" role="img" aria-labelledby="title desc">
<title id="title">单链与双链的链接方向</title><desc id="desc">单链只有向后 next；双链的每个结点还保存向前 prev，首尾外侧为空。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4b8ee8"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#269c72"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d55263"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#596779"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a079ce"/></marker></defs><rect width="720" height="398" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="30" y="35" font-size="21" fill="#4b8ee8" text-anchor="start" font-weight="600">单链：数据 + next</text><rect x="60" y="72" width="120" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="134.4" y1="72" x2="134.4" y2="118" stroke="#4b8ee8" stroke-width="1.4"/><text x="97.2" y="103" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">A</text><text x="157.2" y="102" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="300" y="72" width="120" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="374.4" y1="72" x2="374.4" y2="118" stroke="#4b8ee8" stroke-width="1.4"/><text x="337.2" y="103" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">B</text><text x="397.2" y="102" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="540" y="72" width="120" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="614.4" y1="72" x2="614.4" y2="118" stroke="#4b8ee8" stroke-width="1.4"/><text x="577.2" y="103" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">C</text><text x="637.2" y="102" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">∅</text><path d="M 181 95 H 295" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><path d="M 421 95 H 535" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><text x="237" y="80" font-size="17" fill="#4b8ee8" text-anchor="middle" font-weight="400">next</text><text x="475" y="80" font-size="17" fill="#4b8ee8" text-anchor="middle" font-weight="400">next</text><line x1="28" y1="154" x2="692" y2="154" stroke="#dce2e9" stroke-width="1.4"/><text x="30" y="191" font-size="21" fill="#4b8ee8" text-anchor="start" font-weight="600">双链：prev + 数据 + next</text><rect x="60" y="255" width="120" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="94.8" y1="255" x2="94.8" y2="301" stroke="#4b8ee8" stroke-width="1.4"/><line x1="145.2" y1="255" x2="145.2" y2="301" stroke="#4b8ee8" stroke-width="1.4"/><text x="77.4" y="285" font-size="20" fill="#4b8ee8" text-anchor="middle" font-weight="400">∅</text><text x="120" y="286" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">A</text><text x="162.6" y="285" font-size="19" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="300" y="255" width="120" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="334.8" y1="255" x2="334.8" y2="301" stroke="#4b8ee8" stroke-width="1.4"/><line x1="385.2" y1="255" x2="385.2" y2="301" stroke="#4b8ee8" stroke-width="1.4"/><text x="317.4" y="285" font-size="20" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><text x="360" y="286" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">B</text><text x="402.6" y="285" font-size="19" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="540" y="255" width="120" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="574.8" y1="255" x2="574.8" y2="301" stroke="#4b8ee8" stroke-width="1.4"/><line x1="625.2" y1="255" x2="625.2" y2="301" stroke="#4b8ee8" stroke-width="1.4"/><text x="557.4" y="285" font-size="20" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><text x="600" y="286" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">C</text><text x="642.6" y="285" font-size="19" fill="#4b8ee8" text-anchor="middle" font-weight="400">∅</text><path d="M 181 266 H 295" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><path d="M 421 266 H 535" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><path d="M 299 291 H 185" fill="none" stroke="#269c72" stroke-width="2.4" marker-end="url(#green)"/><path d="M 539 291 H 425" fill="none" stroke="#269c72" stroke-width="2.4" marker-end="url(#green)"/><text x="237" y="249" font-size="17" fill="#4b8ee8" text-anchor="middle" font-weight="400">next</text><text x="475" y="249" font-size="17" fill="#4b8ee8" text-anchor="middle" font-weight="400">next</text><text x="237" y="323" font-size="17" fill="#269c72" text-anchor="middle" font-weight="400">prev</text><text x="475" y="323" font-size="17" fill="#269c72" text-anchor="middle" font-weight="400">prev</text><text x="30" y="372" font-size="18" fill="#596779" text-anchor="start" font-weight="400">反向链接换来方便访问前驱，也增加链接空间与维护工作。</text></g></svg>

