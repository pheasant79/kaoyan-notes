<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect width="760" height="220" fill="#fff"/><text x="380" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">分页地址转换链</text><g font-size="14" text-anchor="middle"><rect x="25" y="75" width="135" height="55" fill="#eff6ff" stroke="#2563eb"/><text x="92" y="98">逻辑地址</text><text x="92" y="119">页号 p | 偏移 d</text><rect x="205" y="75" width="120" height="55" fill="#f5f3ff" stroke="#7c3aed"/><text x="265" y="108">TLB</text><rect x="370" y="75" width="120" height="55" fill="#fef3c7" stroke="#d97706"/><text x="430" y="108">页表</text><rect x="535" y="75" width="195" height="55" fill="#f0fdf4" stroke="#16a34a"/><text x="632" y="98">物理地址</text><text x="632" y="119">页框 f | 偏移 d</text></g><path d="M160 102 H200" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M325 102 H365" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M490 102 H530" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="265" y="58" text-anchor="middle" font-size="12" fill="#7c3aed">命中：直接得到页框</text><text x="430" y="58" text-anchor="middle" font-size="12" fill="#d97706">未命中：查页表</text><text x="380" y="170" text-anchor="middle" font-size="12" fill="#dc2626">页表项无效 → 缺页异常 → 装入页面后重试</text><text x="380" y="195" text-anchor="middle" font-size="12" fill="#64748b">TLB 未命中不等于缺页</text></svg>
