<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect width="760" height="240" fill="#fff"/><text x="380" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">生产者—消费者的资源顺序</text><rect x="45" y="78" width="150" height="58" fill="#eff6ff" stroke="#2563eb"/><text x="120" y="103" text-anchor="middle" font-size="15">生产者</text><text x="120" y="124" text-anchor="middle" font-size="12">P(empty)</text><rect x="305" y="70" width="150" height="75" fill="#fef3c7" stroke="#d97706"/><text x="380" y="100" text-anchor="middle" font-size="15">有界缓冲区</text><text x="380" y="122" text-anchor="middle" font-size="12">mutex 保护</text><rect x="565" y="78" width="150" height="58" fill="#f0fdf4" stroke="#16a34a"/><text x="640" y="103" text-anchor="middle" font-size="15">消费者</text><text x="640" y="124" text-anchor="middle" font-size="12">P(full)</text><path d="M195 107 H300" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M460 107 H560" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M560 162 H200" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/><text x="380" y="185" text-anchor="middle" font-size="12" fill="#64748b">V(full) 表示产生产品，V(empty) 表示取走产品</text><text x="380" y="215" text-anchor="middle" font-size="12" fill="#dc2626">先等槽位，再进入互斥区，避免持锁等待</text></svg>
