<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">取指到执行的寄存器关系</title>
  <desc id="desc">PC 提供地址，主存返回指令，MDR 和 IR 暂存指令，控制器驱动执行。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748B"/></marker></defs>
  <rect width="1200" height="430" fill="#FFFFFF"/>
  <text x="50" y="45" font-size="27" fill="#1E3A8A" font-weight="700">G1-02 取指—译码—执行骨架</text>
  <g font-size="22" text-anchor="middle">
    <rect x="55" y="125" width="150" height="90" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="130" y="178" fill="#1E40AF">PC</text><text x="130" y="202" font-size="15" fill="#475569">下一条指令地址</text>
    <rect x="275" y="125" width="150" height="90" rx="7" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><text x="350" y="178" fill="#854D0E">MAR</text><text x="350" y="202" font-size="15" fill="#475569">本次访问地址</text>
    <rect x="495" y="125" width="150" height="90" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="570" y="178" fill="#166534">MDR</text><text x="570" y="202" font-size="15" fill="#475569">读回的数据/指令</text>
    <rect x="715" y="125" width="150" height="90" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="790" y="178" fill="#1E40AF">IR</text><text x="790" y="202" font-size="15" fill="#475569">当前指令</text>
    <rect x="935" y="125" width="190" height="90" rx="7" fill="#F3E8FF" stroke="#9333EA" stroke-width="3"/><text x="1030" y="170" fill="#7E22CE">控制器 + 数据通路</text><text x="1030" y="198" font-size="15" fill="#475569">译码、运算、访存、写回</text>
  </g>
  <line x1="205" y1="170" x2="275" y2="170" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/><line x1="425" y1="170" x2="495" y2="170" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/><line x1="645" y1="170" x2="715" y2="170" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/><line x1="865" y1="170" x2="935" y2="170" stroke="#64748B" stroke-width="4" marker-end="url(#a)"/>
  <text x="240" y="150" text-anchor="middle" font-size="16" fill="#475569">MAR ← PC</text><text x="460" y="150" text-anchor="middle" font-size="16" fill="#475569">MDR ← M[MAR]</text><text x="680" y="150" text-anchor="middle" font-size="16" fill="#475569">IR ← MDR</text><text x="900" y="150" text-anchor="middle" font-size="16" fill="#475569">译码</text>
  <path d="M1030 215 C1030 330, 790 330, 790 215" fill="none" stroke="#16A34A" stroke-width="4" marker-end="url(#a)"/>
  <text x="910" y="315" text-anchor="middle" font-size="18" fill="#166534">执行阶段：必要时再次访存，并更新 PC/寄存器</text>
  <text x="55" y="390" font-size="19" fill="#B91C1C">边界：取指访存取得指令；执行访存取得操作数或写回结果。</text>
</svg>
