<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">初等变换与矩阵秩</title>
  <desc id="desc">原矩阵经过初等行变换化为阶梯形，再通过主元数量得到矩阵秩。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker></defs>
  <rect width="900" height="210" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle">
    <rect x="35" y="62" width="170" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="120" y="95" fill="#1E3A8A">原矩阵 A</text><text x="120" y="123" fill="#475569" font-size="14">数表与线性关系</text>
    <line x1="208" y1="103" x2="292" y2="103" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="295" y="62" width="170" height="82" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="380" y="95" fill="#166534">初等行变换</text><text x="380" y="123" fill="#475569" font-size="14">交换、倍乘、倍加</text>
    <line x1="468" y1="103" x2="552" y2="103" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="555" y="62" width="145" height="82" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="627" y="95" fill="#334155">阶梯形</text><text x="627" y="123" fill="#475569" font-size="14">主元清晰</text>
    <line x1="703" y1="103" x2="780" y2="103" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="783" y="62" width="82" height="82" rx="8" fill="#FDF4FF" stroke="#9333EA" stroke-width="2"/>
    <text x="824" y="99" fill="#7E22CE">r(A)</text><text x="824" y="123" fill="#475569" font-size="13">主元数</text>
  </g>
  <text x="450" y="184" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#64748B">行变换保留秩；非齐次方程组需对增广矩阵同步变换才保留解集</text>
</svg>
