<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>
  <rect width="760" height="285" fill="#fff"/>
  <text x="380" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">进程状态转换</text>
  <g font-size="16" text-anchor="middle">
    <rect x="305" y="55" width="150" height="48" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="85">运行</text>
    <rect x="70" y="165" width="150" height="48" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="145" y="195">就绪</text>
    <rect x="540" y="165" width="150" height="48" rx="24" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="615" y="195">阻塞</text>
  </g>
  <path d="M305 78 C245 58 168 86 145 160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="183" y="91" font-size="12">抢占/时间片用完</text>
  <path d="M220 171 C248 127 280 104 310 96" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="145" font-size="12">调度/获得 CPU</text>
  <path d="M455 85 C510 95 550 125 570 160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="532" y="112" font-size="12">请求 I/O/资源</text>
  <path d="M540 205 C470 250 290 250 220 205" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="240" text-anchor="middle" font-size="12" fill="#15803d">事件完成：阻塞 → 就绪</text>
  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#64748b">回到就绪队列后，仍需等待 CPU 调度</text>
</svg>
