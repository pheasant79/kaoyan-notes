<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">实对称矩阵的正交对角化</title>
  <desc id="desc">实对称矩阵的特征值为实数，不同特征值的特征向量正交，存在正交矩阵进行对角化。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker></defs>
  <rect width="900" height="220" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="40" y="68" width="180" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="130" y="111" font-size="20" fill="#1E3A8A">A=Aᵀ</text>
    <line x1="224" y1="104" x2="332" y2="104" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="335" y="68" width="205" height="72" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="437" y="99" font-size="18" fill="#166534">特征值为实数</text><text x="437" y="123" font-size="14" fill="#475569">不同特征值的向量正交</text>
    <line x1="544" y1="104" x2="652" y2="104" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="655" y="68" width="205" height="72" rx="8" fill="#FDF4FF" stroke="#9333EA" stroke-width="2"/><text x="757" y="99" font-size="18" fill="#7E22CE">QᵀAQ=Λ</text><text x="757" y="123" font-size="14" fill="#475569">Q 为正交矩阵</text>
  </g>
  <text x="450" y="183" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" fill="#64748B">正交对角化同时连接特征值和二次型标准化</text>
</svg>
