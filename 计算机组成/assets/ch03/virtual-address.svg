<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 380" role="img" aria-labelledby="title desc"><title id="title">虚拟地址转换</title><desc id="desc">虚拟页号通过 TLB 或页表映射为物理页框号，页内偏移保持不变。</desc><rect width="1150" height="380" fill="#F8FAFC"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G3-04 虚拟地址到物理地址</text><rect x="60" y="105" width="250" height="90" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="185" y="145" text-anchor="middle" font-size="22" fill="#1E40AF">虚拟地址</text><text x="185" y="174" text-anchor="middle" font-size="17" fill="#475569">[虚拟页号 | 页内偏移]</text><rect x="425" y="80" width="260" height="140" rx="7" fill="#F3E8FF" stroke="#9333EA" stroke-width="3"/><text x="555" y="125" text-anchor="middle" font-size="22" fill="#7E22CE">TLB / 页表</text><text x="555" y="163" text-anchor="middle" font-size="17" fill="#475569">页号 → 页框号</text><text x="555" y="190" text-anchor="middle" font-size="17" fill="#B91C1C">未命中可能触发页表访问</text><rect x="800" y="105" width="280" height="90" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="940" y="145" text-anchor="middle" font-size="22" fill="#166534">物理地址</text><text x="940" y="174" text-anchor="middle" font-size="17" fill="#475569">[物理页框号 | 页内偏移]</text><line x1="310" y1="150" x2="425" y2="150" stroke="#64748B" stroke-width="4"/><line x1="685" y1="150" x2="800" y2="150" stroke="#64748B" stroke-width="4"/><text x="60" y="285" font-size="19" fill="#475569">转换之后才进入 Cache/主存访问；TLB 保存映射，不保存数据副本。</text><text x="60" y="325" font-size="19" fill="#B91C1C">页大小决定页内偏移位数，映射失败时进入缺页处理。</text></svg>
