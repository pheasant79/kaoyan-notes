<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">Cache 地址划分</title><desc id="desc">地址分为 Tag、组号和块内地址，先定位组，再比较标记。</desc><rect width="1100" height="350" fill="#FFFFFF"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G3-03 Cache 命中判断</text><rect x="80" y="105" width="940" height="75" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/><rect x="80" y="105" width="520" height="75" fill="#EDE9FE" stroke="#7E22CE" stroke-width="2"/><rect x="600" y="105" width="220" height="75" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="820" y="105" width="200" height="75" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="340" y="150" text-anchor="middle" font-size="22" fill="#7E22CE">Tag：比较身份</text><text x="710" y="150" text-anchor="middle" font-size="22" fill="#1E40AF">Index：定位组</text><text x="920" y="150" text-anchor="middle" font-size="22" fill="#166534">Offset：块内位置</text><line x1="710" y1="205" x2="710" y2="255" stroke="#64748B" stroke-width="3"/><text x="710" y="285" text-anchor="middle" font-size="19" fill="#475569">组号找到候选行 → 有效位/Tag 匹配 → Offset 取字节</text><text x="80" y="325" font-size="18" fill="#B91C1C">字段位数必须由地址位宽、块大小和组数共同决定。</text></svg>
