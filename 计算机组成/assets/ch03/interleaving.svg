<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc"><title id="title">高位交叉与低位交叉</title><desc id="desc">比较地址高位和低位分别作为存储体号的方式。</desc><rect width="1100" height="390" fill="#F8FAFC"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G3-02 地址怎样分配到多个存储体</text><text x="65" y="95" font-size="22" fill="#1E40AF">高位交叉</text><text x="65" y="135" font-size="20" fill="#475569">[体号][体内地址]</text><rect x="65" y="170" width="180" height="58" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="155" y="206" text-anchor="middle" font-size="18" fill="#1E40AF">连续地址多在同一体</text><text x="65" y="275" font-size="18" fill="#475569">便于按区域分配</text><text x="600" y="95" font-size="22" fill="#166534">低位交叉</text><text x="600" y="135" font-size="20" fill="#475569">[体内地址][体号]</text><rect x="600" y="170" width="390" height="58" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="795" y="206" text-anchor="middle" font-size="18" fill="#166534">连续地址轮流进入不同体</text><text x="600" y="275" font-size="18" fill="#475569">适合连续访问时并行启动</text><line x1="530" y1="75" x2="530" y2="320" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7 7"/><text x="65" y="350" font-size="18" fill="#B91C1C">真正访问速度还取决于体数、启动周期和题目给出的时序条件。</text></svg>
