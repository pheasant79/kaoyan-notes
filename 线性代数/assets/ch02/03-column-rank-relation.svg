<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">矩阵列向量与秩的关系</title>
  <desc id="desc">同一矩阵的列向量组成向量组，行化简确定主元列位置和主元数量，主元数量给出矩阵秩，回到原矩阵取对应主元列得到极大无关组。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker>
  </defs>
  <rect width="960" height="300" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="30" y="70" width="180" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="120" y="105" font-size="20" fill="#1E3A8A">矩阵 A</text>
    <text x="120" y="135" font-size="15" fill="#475569">列向量 α₁, α₂, …</text>
    <text x="120" y="158" font-size="13" fill="#475569">同一组线性关系</text>

    <line x1="214" y1="120" x2="300" y2="120" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="305" y="70" width="190" height="100" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="400" y="105" font-size="19" fill="#166534">行化简</text>
    <text x="400" y="135" font-size="15" fill="#475569">找到主元列位置</text>
    <text x="400" y="158" font-size="13" fill="#475569">表示形式改变</text>

    <line x1="499" y1="120" x2="585" y2="120" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="590" y="35" width="160" height="78" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="670" y="68" font-size="18" fill="#334155">主元数量</text>
    <text x="670" y="94" font-size="14" fill="#475569">r(A)</text>

    <rect x="590" y="150" width="160" height="78" rx="8" fill="#FDF4FF" stroke="#9333EA" stroke-width="2"/>
    <text x="670" y="181" font-size="17" fill="#7E22CE">回原矩阵取列</text>
    <text x="670" y="207" font-size="14" fill="#475569">极大无关组</text>

    <line x1="755" y1="74" x2="835" y2="74" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="755" y1="190" x2="835" y2="190" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="840" y="70" width="95" height="100" rx="8" fill="#FFF7ED" stroke="#CA8A04" stroke-width="2"/>
    <text x="887" y="105" font-size="16" fill="#92400E">独立信息</text>
    <text x="887" y="132" font-size="14" fill="#475569">秩 = 组中</text>
    <text x="887" y="154" font-size="14" fill="#475569">独立向量数</text>
  </g>
  <text x="480" y="270" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#DC2626">注意：主元列位置由行化简确定，但极大无关组的列必须回到原矩阵取得</text>
</svg>
