<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc"><title id="title">三种 I/O 方式</title><desc id="desc">比较程序查询、中断和 DMA 中 CPU 的参与程度。</desc><rect width="1180" height="360" fill="#F8FAFC"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G7-02 查询、中断、DMA 的选择</text><rect x="55" y="100" width="320" height="165" rx="8" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><text x="215" y="142" text-anchor="middle" font-size="22" fill="#854D0E">程序查询</text><text x="215" y="185" text-anchor="middle" font-size="18" fill="#475569">CPU 反复读状态</text><text x="215" y="225" text-anchor="middle" font-size="18" fill="#B91C1C">忙等，参与最高</text><rect x="430" y="100" width="320" height="165" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="590" y="142" text-anchor="middle" font-size="22" fill="#1E40AF">中断</text><text x="590" y="185" text-anchor="middle" font-size="18" fill="#475569">设备就绪后请求 CPU</text><text x="590" y="225" text-anchor="middle" font-size="18" fill="#166534">事件驱动，中等参与</text><rect x="805" y="100" width="320" height="165" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="965" y="142" text-anchor="middle" font-size="22" fill="#166534">DMA</text><text x="965" y="185" text-anchor="middle" font-size="18" fill="#475569">控制器批量搬运</text><text x="965" y="225" text-anchor="middle" font-size="18" fill="#166534">块传输，CPU 参与最低</text><text x="55" y="315" font-size="19" fill="#475569">选择依据：数据量、事件规律、CPU 可用时间和总线占用。</text></svg>
