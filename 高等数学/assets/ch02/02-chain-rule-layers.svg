<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <rect width="900" height="300" fill="white"/>
  <text x="38" y="38" fill="#0F172A" font-size="24" font-weight="bold">链式法则：沿依赖路径相乘</text>
  <rect x="75" y="105" width="190" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="355" y="105" width="190" height="76" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <rect x="635" y="105" width="190" height="76" rx="8" fill="#FAF5FF" stroke="#9333EA" stroke-width="2"/>
  <text x="145" y="140" fill="#2563EB" font-size="24" font-weight="bold">x</text>
  <text x="110" y="168" fill="#334155" font-size="17">自变量</text>
  <text x="425" y="140" fill="#16A34A" font-size="24" font-weight="bold">u = g(x)</text>
  <text x="388" y="168" fill="#334155" font-size="17">中间变量</text>
  <text x="690" y="140" fill="#9333EA" font-size="24" font-weight="bold">y = f(u)</text>
  <text x="670" y="168" fill="#334155" font-size="17">目标函数</text>
  <line x1="265" y1="143" x2="355" y2="143" stroke="#475569" stroke-width="3"/>
  <polygon points="355,143 341,136 341,150" fill="#475569"/>
  <line x1="545" y1="143" x2="635" y2="143" stroke="#475569" stroke-width="3"/>
  <polygon points="635,143 621,136 621,150" fill="#475569"/>
  <text x="278" y="120" fill="#16A34A" font-size="18">du/dx</text>
  <text x="558" y="120" fill="#9333EA" font-size="18">dy/du</text>
  <text x="236" y="240" fill="#0F172A" font-size="23" font-weight="bold">dy/dx = (dy/du)(du/dx)</text>
  <text x="256" y="272" fill="#475569" font-size="17">每条依赖路径相乘；多条路径再相加。</text>
</svg>
