<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">浮点加减流程</title><desc id="desc">浮点数先对阶，再进行尾数运算，最后规格化和舍入。</desc><rect width="1200" height="310" fill="#FFFFFF"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G2-03 浮点加减的顺序</text><g font-size="20" text-anchor="middle"><rect x="40" y="105" width="170" height="80" rx="7" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><text x="125" y="152" fill="#854D0E">对阶</text><rect x="260" y="105" width="190" height="80" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="355" y="152" fill="#1E40AF">尾数运算</text><rect x="500" y="105" width="190" height="80" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="595" y="152" fill="#166534">规格化</text><rect x="740" y="105" width="190" height="80" rx="7" fill="#F3E8FF" stroke="#9333EA" stroke-width="3"/><text x="835" y="152" fill="#7E22CE">舍入</text><rect x="980" y="105" width="170" height="80" rx="7" fill="#FECACA" stroke="#DC2626" stroke-width="3"/><text x="1065" y="152" fill="#991B1B">异常检查</text></g><g stroke="#64748B" stroke-width="4"><line x1="210" y1="145" x2="260" y2="145"/><line x1="450" y1="145" x2="500" y2="145"/><line x1="690" y1="145" x2="740" y2="145"/><line x1="930" y1="145" x2="980" y2="145"/></g><text x="40" y="245" font-size="19" fill="#475569">阶码管数量级，尾数管有效数字；不能跳过对阶直接相加尾数。</text></svg>
