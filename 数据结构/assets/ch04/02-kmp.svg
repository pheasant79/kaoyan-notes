<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <rect width="720" height="380" fill="#ffffff"/>
  <style>
    .cell{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.hot{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.keep{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}
    .t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:20px;fill:#1f2937;text-anchor:middle}.s{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:17px;fill:#475569;text-anchor:middle}
  </style>
  <text x="360" y="30" class="t">T=ababac，P=ababb：第五位失配，q=4 → π[3]=2</text>
  <text x="55" y="92" class="s">T</text><text x="55" y="147" class="s">P</text>
  <g transform="translate(90 65)">
    <g><rect x="0" y="0" width="70" height="50" class="keep"/><text x="35" y="33" class="t">a</text><rect x="70" y="0" width="70" height="50" class="keep"/><text x="105" y="33" class="t">b</text><rect x="140" y="0" width="70" height="50" class="keep"/><text x="175" y="33" class="t">a</text><rect x="210" y="0" width="70" height="50" class="keep"/><text x="245" y="33" class="t">b</text><rect x="280" y="0" width="70" height="50" class="hot"/><text x="315" y="33" class="t">a</text><rect x="350" y="0" width="70" height="50" class="cell"/><text x="385" y="33" class="t">c</text></g>
    <g transform="translate(0 58)"><rect x="0" y="0" width="70" height="50" class="keep"/><text x="35" y="33" class="t">a</text><rect x="70" y="0" width="70" height="50" class="keep"/><text x="105" y="33" class="t">b</text><rect x="140" y="0" width="70" height="50" class="keep"/><text x="175" y="33" class="t">a</text><rect x="210" y="0" width="70" height="50" class="keep"/><text x="245" y="33" class="t">b</text><rect x="280" y="0" width="70" height="50" class="cell"/><text x="315" y="33" class="t">b</text></g>
    <g transform="translate(140 142)"><rect x="0" y="0" width="70" height="50" class="keep"/><text x="35" y="33" class="t">a</text><rect x="70" y="0" width="70" height="50" class="keep"/><text x="105" y="33" class="t">b</text><rect x="140" y="0" width="70" height="50" class="keep"/><text x="175" y="33" class="t">a</text><text x="315" y="32" class="s">q=2；比较 P[2] 与 T[4]</text></g>
  </g>
  <path d="M385 250 C440 225 470 210 520 210" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#16a34a"/></marker></defs>
  <text x="585" y="205" class="s">T[4]=a 与 P[2]=a</text><text x="585" y="235" class="s">主串位置保持不变</text><text x="360" y="350" class="s">已知后缀 ab = 模式前缀 ab；回退后继续比较当前 a。</text>
</svg>

