<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc"><title id="title">寻址方式与有效地址</title><desc id="desc">比较立即、直接、间接、基址、变址和相对寻址。</desc><rect width="1180" height="420" fill="#F8FAFC"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G4-02 字段 A 怎样变成有效地址</text><g font-size="19"><rect x="55" y="90" width="330" height="80" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="75" y="122" fill="#1E40AF">立即：操作数 = A</text><text x="75" y="150" fill="#475569">不再访问存储器</text><rect x="425" y="90" width="330" height="80" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="445" y="122" fill="#166534">直接：EA = A</text><text x="445" y="150" fill="#475569">再访问 M[EA]</text><rect x="795" y="90" width="330" height="80" rx="7" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/><text x="815" y="122" fill="#7E22CE">间接：EA = M[A]</text><text x="815" y="150" fill="#475569">先取地址，再取操作数</text><rect x="55" y="220" width="330" height="80" rx="7" fill="#FEF3C7" stroke="#CA8A04" stroke-width="2"/><text x="75" y="252" fill="#854D0E">基址：EA = BR + A</text><text x="75" y="280" fill="#475569">重定位、段/区起点</text><rect x="425" y="220" width="330" height="80" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="445" y="252" fill="#166534">变址：EA = IX + A</text><text x="445" y="280" fill="#475569">数组和循环索引</text><rect x="795" y="220" width="330" height="80" rx="7" fill="#FECACA" stroke="#DC2626" stroke-width="2"/><text x="815" y="252" fill="#991B1B">相对：EA = PC + d</text><text x="815" y="280" fill="#475569">分支目标，基准按题目</text></g><text x="55" y="360" font-size="19" fill="#475569">判断顺序：字段含义 → 寄存器参与 → 是否需要再次访存 → 最终 EA。</text></svg>
