<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">主存地址与数据通路</title><desc id="desc">CPU 通过 MAR 提供地址，经译码器选择存储单元，数据通过 MDR 和数据线读写。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#334155"/></marker></defs>
  <rect width="960" height="250" fill="#ffffff"/>
  <text x="30" y="30" font-size="20" font-family="sans-serif" fill="#1e3a8a">主存地址与数据通路</text>
  <rect x="35" y="85" width="130" height="62" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="100" y="112" text-anchor="middle" font-size="17" font-family="sans-serif">CPU / MAR</text><text x="100" y="133" text-anchor="middle" font-size="13" font-family="sans-serif">提供地址</text>
  <rect x="235" y="75" width="160" height="82" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="315" y="108" text-anchor="middle" font-size="17" font-family="sans-serif">地址译码器</text><text x="315" y="132" text-anchor="middle" font-size="13" font-family="sans-serif">选择单元/芯片</text>
  <rect x="470" y="65" width="185" height="102" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="562" y="105" text-anchor="middle" font-size="17" font-family="sans-serif">存储阵列</text><text x="562" y="128" text-anchor="middle" font-size="13" font-family="sans-serif">存储元 → 单元</text><text x="562" y="148" text-anchor="middle" font-size="13" font-family="sans-serif">按地址组织</text>
  <rect x="735" y="85" width="170" height="62" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="820" y="112" text-anchor="middle" font-size="17" font-family="sans-serif">MDR / 数据线</text><text x="820" y="133" text-anchor="middle" font-size="13" font-family="sans-serif">读出或写入数据</text>
  <line x1="165" y1="105" x2="235" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="200" y="92" text-anchor="middle" font-size="13" font-family="sans-serif">地址线</text>
  <line x1="395" y1="105" x2="470" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="432" y="92" text-anchor="middle" font-size="13" font-family="sans-serif">片选</text>
  <line x1="655" y1="105" x2="735" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="92" text-anchor="middle" font-size="13" font-family="sans-serif">数据线</text>
  <line x1="735" y1="135" x2="655" y2="135" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="480" y="215" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#475569">地址负责定位，译码负责选择，数据线负责传送，控制线决定读写时机</text>
</svg>
