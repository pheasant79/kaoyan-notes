<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc"><title id="title">补码加法溢出判断</title><desc id="desc">同号相加得到异号表示有符号溢出，无符号则检查最高位进位。</desc><rect width="1100" height="390" fill="#F8FAFC"/><text x="45" y="45" font-size="28" fill="#1E3A8A" font-weight="700">G2-02 两种溢出判断</text><rect x="55" y="95" width="455" height="230" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/><text x="282" y="135" text-anchor="middle" font-size="23" fill="#1E40AF" font-weight="700">有符号补码</text><text x="85" y="185" font-size="21" fill="#334155">同号 + 同号</text><text x="85" y="225" font-size="21" fill="#334155">结果符号变成另一种</text><text x="85" y="275" font-size="22" fill="#B91C1C" font-weight="700">→ 溢出</text><rect x="590" y="95" width="455" height="230" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/><text x="817" y="135" text-anchor="middle" font-size="23" fill="#166534" font-weight="700">无符号数</text><text x="620" y="185" font-size="21" fill="#334155">最高位产生进位</text><text x="620" y="225" font-size="21" fill="#334155">结果超出 n 位范围</text><text x="620" y="275" font-size="22" fill="#B91C1C" font-weight="700">→ 溢出</text><text x="55" y="360" font-size="19" fill="#475569">同一位模式可能在两种解释下得到不同的溢出结论。</text></svg>
