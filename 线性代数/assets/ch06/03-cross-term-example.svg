<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img" aria-labelledby="title desc">
  <title id="title">交叉项消去示例</title>
  <desc id="desc">二次型 x² 加 4xy 加 5y² 通过可逆变量替换 y1 等于 x 加 2y、y2 等于 y，变为 y1² 加 y2²，展示交叉项被消去。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker></defs>
  <rect width="820" height="230" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="35" y="70" width="250" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="160" y="105" font-size="22" fill="#1E3A8A">x² + 4xy + 5y²</text>
    <text x="160" y="132" font-size="14" fill="#475569">含交叉项的二次型</text>
    <line x1="292" y1="111" x2="500" y2="111" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="395" y="82" font-size="15" fill="#166534">y₁ = x + 2y</text>
    <text x="395" y="102" font-size="15" fill="#166534">y₂ = y</text>
    <rect x="505" y="70" width="250" height="82" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="630" y="105" font-size="22" fill="#166534">y₁² + y₂²</text>
    <text x="630" y="132" font-size="14" fill="#475569">对角平方结构</text>
  </g>
  <text x="410" y="190" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#DC2626">变量变换改变矩阵表示，但处理的是二次型的合同结构</text>
</svg>
