<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect width="760" height="245" fill="#fff"/><text x="380" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">查询、中断与 DMA</text><g font-size="14" text-anchor="middle"><rect x="35" y="65" width="190" height="55" fill="#eff6ff" stroke="#2563eb"/><text x="130" y="90">程序查询</text><text x="130" y="110">CPU 反复读状态</text><rect x="285" y="65" width="190" height="55" fill="#f5f3ff" stroke="#7c3aed"/><text x="380" y="90">中断</text><text x="380" y="110">设备就绪时通知 CPU</text><rect x="535" y="65" width="190" height="55" fill="#f0fdf4" stroke="#16a34a"/><text x="630" y="90">DMA</text><text x="630" y="110">设备—主存批量搬运</text></g><path d="M130 145 V190 H380 V145" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M380 145 V190 H630 V145" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="255" y="213" text-anchor="middle" font-size="12" fill="#64748b">CPU 负担较高</text><text x="505" y="213" text-anchor="middle" font-size="12" fill="#64748b">CPU 初始化并处理完成</text><text x="380" y="237" text-anchor="middle" font-size="12" fill="#dc2626">中断是通知，DMA 是搬运</text></svg>
