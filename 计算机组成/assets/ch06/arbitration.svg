<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 360" role="img" aria-labelledby="title desc"><title id="title">总线仲裁时序</title><desc id="desc">主设备请求，仲裁授权，随后完成地址和数据传输并释放总线。</desc><rect width="1150" height="360" fill="#F8FAFC"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G6-02 请求—授权—传输—释放</text><g font-size="20" text-anchor="middle"><rect x="70" y="110" width="190" height="80" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><text x="165" y="158" fill="#854D0E">请求总线</text><rect x="330" y="110" width="190" height="80" fill="#F3E8FF" stroke="#9333EA" stroke-width="3"/><text x="425" y="158" fill="#7E22CE">仲裁授权</text><rect x="590" y="110" width="220" height="80" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="700" y="158" fill="#1E40AF">地址 + 控制</text><rect x="880" y="110" width="190" height="80" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="975" y="158" fill="#166534">数据传输</text></g><g stroke="#64748B" stroke-width="4"><line x1="260" y1="150" x2="330" y2="150"/><line x1="520" y1="150" x2="590" y2="150"/><line x1="810" y1="150" x2="880" y2="150"/></g><text x="70" y="255" font-size="19" fill="#475569">事务结束后释放总线，其他主设备才能获得控制权。</text><text x="70" y="300" font-size="19" fill="#B91C1C">没有授权时，主设备不能同时驱动共享地址/数据线。</text></svg>
