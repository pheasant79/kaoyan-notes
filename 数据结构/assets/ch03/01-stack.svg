<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350">
  <rect width="760" height="350" fill="#ffffff"/>
  <style>
    .cell{fill:#eef5ff;stroke:#4b8ee8;stroke-width:2}.empty{fill:#f8fafc;stroke:#a9b5c5;stroke-width:2}
    .t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:19px;fill:#1f2937;text-anchor:middle}
    .s{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569;text-anchor:middle}
    .arr{stroke:#269c72;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#269c72"/></marker></defs>
  <text x="380" y="30" class="t">入栈 A → B → C；一次出栈只取出栈顶 C</text>

  <g transform="translate(35 65)">
    <text x="75" y="0" class="s">初始：空栈</text>
    <rect x="5" y="20" width="140" height="42" class="empty"/><rect x="5" y="62" width="140" height="42" class="empty"/><rect x="5" y="104" width="140" height="42" class="empty"/>
    <text x="75" y="180" class="s">栈顶 = 栈底</text>
  </g>
  <path d="M190 140 H235" class="arr"/><text x="212" y="120" class="s">压入 A、B、C</text>

  <g transform="translate(245 65)">
    <text x="75" y="0" class="s">入栈后</text>
    <rect x="5" y="20" width="140" height="42" class="cell"/><text x="75" y="48" class="t">C</text>
    <rect x="5" y="62" width="140" height="42" class="cell"/><text x="75" y="90" class="t">B</text>
    <rect x="5" y="104" width="140" height="42" class="cell"/><text x="75" y="132" class="t">A</text>
    <text x="75" y="180" class="s">栈顶在 C</text>
  </g>
  <path d="M400 140 H445" class="arr"/><text x="422" y="120" class="s">出栈 C</text>

  <g transform="translate(455 65)">
    <text x="75" y="0" class="s">出栈后</text>
    <rect x="5" y="20" width="140" height="42" class="empty"/>
    <rect x="5" y="62" width="140" height="42" class="cell"/><text x="75" y="90" class="t">B</text>
    <rect x="5" y="104" width="140" height="42" class="cell"/><text x="75" y="132" class="t">A</text>
    <text x="75" y="180" class="s">栈顶变为 B</text>
  </g>
  <g transform="translate(640 98)">
    <text x="50" y="0" class="s" fill="#d55263">输出：C</text>
    <text x="50" y="28" class="s">栈内仍有 B、A</text>
    <text x="50" y="56" class="s" fill="#d55263">不能直接取 A</text>
  </g>
</svg>
