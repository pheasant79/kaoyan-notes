<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">存储元到存储体</title><desc id="desc">存储元组成存储单元，多个单元形成按地址访问的存储体。</desc><rect width="1100" height="360" fill="#FFFFFF"/><text x="40" y="44" font-size="28" fill="#1E3A8A" font-weight="700">G3-01 从 1 位到可编址存储空间</text><g font-size="21" text-anchor="middle"><rect x="55" y="130" width="180" height="100" rx="7" fill="#FECACA" stroke="#DC2626" stroke-width="3"/><text x="145" y="177" fill="#991B1B">存储元</text><text x="145" y="205" font-size="16" fill="#475569">1 bit</text><rect x="330" y="105" width="230" height="150" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="445" y="160" fill="#1E40AF">存储单元</text><text x="445" y="198" font-size="16" fill="#475569">一次可编址读写</text><text x="445" y="222" font-size="16" fill="#475569">n 位/字节/字</text><rect x="655" y="75" width="370" height="210" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="840" y="125" fill="#166534">存储体</text><rect x="720" y="150" width="240" height="95" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><line x1="720" y1="182" x2="960" y2="182" stroke="#86EFAC" stroke-width="2"/><line x1="720" y1="214" x2="960" y2="214" stroke="#86EFAC" stroke-width="2"/><text x="840" y="173" font-size="16" fill="#166534">地址 0</text><text x="840" y="205" font-size="16" fill="#166534">地址 1</text><text x="840" y="237" font-size="16" fill="#166534">...</text></g><g stroke="#64748B" stroke-width="4"><line x1="235" y1="180" x2="330" y2="180"/><line x1="560" y1="180" x2="655" y2="180"/></g><text x="282" y="155" text-anchor="middle" font-size="16" fill="#475569">组合</text><text x="607" y="155" text-anchor="middle" font-size="16" fill="#475569">按地址排列</text></svg>
