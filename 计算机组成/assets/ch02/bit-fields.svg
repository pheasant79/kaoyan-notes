<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">数据表示位字段</title><desc id="desc">展示定点数和浮点数中符号、数值、阶码和尾数的角色。</desc><rect width="1100" height="360" fill="#FFFFFF"/><text x="45" y="45" font-size="28" fill="#1E3A8A" font-weight="700">G2-01 位字段怎样被解释</text><text x="60" y="95" font-size="22" fill="#475569">定点补码（示意）</text><rect x="60" y="120" width="100" height="70" fill="#FECACA" stroke="#DC2626" stroke-width="2"/><rect x="160" y="120" width="560" height="70" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="110" y="163" text-anchor="middle" font-size="20" fill="#991B1B">符号</text><text x="440" y="163" text-anchor="middle" font-size="20" fill="#1E40AF">数值位 / 补码位模式</text><text x="60" y="245" font-size="22" fill="#475569">浮点数（示意）</text><rect x="60" y="270" width="100" height="55" fill="#FECACA" stroke="#DC2626" stroke-width="2"/><rect x="160" y="270" width="260" height="55" fill="#FEF3C7" stroke="#CA8A04" stroke-width="2"/><rect x="420" y="270" width="500" height="55" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="110" y="305" text-anchor="middle" font-size="18" fill="#991B1B">符号</text><text x="290" y="305" text-anchor="middle" font-size="18" fill="#854D0E">阶码：范围</text><text x="670" y="305" text-anchor="middle" font-size="18" fill="#166534">尾数：精度</text><text x="760" y="163" font-size="18" fill="#475569">位宽、编码规则和解释方式必须先确定</text></svg>
