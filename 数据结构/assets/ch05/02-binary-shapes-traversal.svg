<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
  <title id="title">二叉树遍历和完全二叉树下标</title>
  <desc id="desc">左边用同一棵二叉树展示先序、中序、后序、层序序列；右边展示结点编号 1 到 6 的完全二叉树以及父子下标关系。</desc>
  <rect width="720" height="405" fill="#FFFFFF"/>
  <line x1="374" y1="18" x2="374" y2="386" stroke="#D1D5DB" stroke-width="1"/>
  <text x="184" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1F2937">同一棵树，四种访问规则</text>
  <text x="548" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1F2937">完全二叉树顺序存储</text>

  <g fill="none" stroke="#9CA3AF" stroke-width="2">
    <path d="M184 75 L112 130 M184 75 L256 130"/>
    <path d="M112 158 L76 213 M112 158 L148 213"/>
    <path d="M256 158 L220 213"/>
  </g>
  <g fill="#FFFFFF" stroke="#4b8ee8" stroke-width="2">
    <circle cx="184" cy="63" r="18"/><circle cx="112" cy="146" r="18"/><circle cx="256" cy="146" r="18"/>
    <circle cx="76" cy="229" r="18"/><circle cx="148" cy="229" r="18"/><circle cx="220" cy="229" r="18"/>
  </g>
  <g font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#111827">
    <text x="184" y="63">A</text><text x="112" y="146">B</text><text x="256" y="146">C</text>
    <text x="76" y="229">D</text><text x="148" y="229">E</text><text x="220" y="229">F</text>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#374151">
    <text x="24" y="275">先序</text><text x="86" y="275">A B D E C F</text>
    <text x="24" y="302">中序</text><text x="86" y="302">D B E A F C</text>
    <text x="24" y="329">后序</text><text x="86" y="329">D E B F C A</text>
    <text x="24" y="356">层序</text><text x="86" y="356">A B C D E F</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="2">
    <path d="M548 79 L482 132 M548 79 L614 132"/>
    <path d="M482 160 L449 213 M482 160 L515 213"/>
    <path d="M614 160 L581 213"/>
  </g>
  <g fill="#FFFFFF" stroke="#269c72" stroke-width="2">
    <circle cx="548" cy="67" r="19"/><circle cx="482" cy="144" r="19"/><circle cx="614" cy="144" r="19"/>
    <circle cx="449" cy="225" r="19"/><circle cx="515" cy="225" r="19"/><circle cx="581" cy="225" r="19"/>
  </g>
  <g font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#111827">
    <text x="548" y="67">1</text><text x="482" y="144">2</text><text x="614" y="144">3</text>
    <text x="449" y="225">4</text><text x="515" y="225">5</text><text x="581" y="225">6</text>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#374151">
    <text x="399" y="275">1 起点：父 i = ⌊i/2⌋</text>
    <text x="399" y="302">左子：2i；右子：2i+1</text>
    <text x="399" y="329">仅在下标 ≤ n 时存在</text>
    <text x="399" y="356">0 起点：子为 2i+1、2i+2</text>
  </g>
</svg>

