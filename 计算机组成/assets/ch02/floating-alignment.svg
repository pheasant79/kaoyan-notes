<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">浮点加减对阶流程</title><desc id="desc">浮点加减依次比较阶码、右移较小阶、完成尾数运算、规格化并舍入检查异常。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#334155"/></marker></defs>
  <rect width="960" height="250" fill="#ffffff"/>
  <text x="30" y="30" font-size="20" font-family="sans-serif" fill="#1e3a8a">浮点加减：先对阶，再运算</text>
  <rect x="35" y="88" width="150" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="110" y="122" text-anchor="middle" font-size="16" font-family="sans-serif">比较阶码</text>
  <rect x="230" y="88" width="150" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="305" y="122" text-anchor="middle" font-size="16" font-family="sans-serif">右移较小阶</text>
  <rect x="425" y="88" width="150" height="60" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="500" y="122" text-anchor="middle" font-size="16" font-family="sans-serif">尾数加减</text>
  <rect x="620" y="88" width="150" height="60" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/><text x="695" y="122" text-anchor="middle" font-size="16" font-family="sans-serif">规格化</text>
  <rect x="815" y="88" width="110" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="870" y="122" text-anchor="middle" font-size="16" font-family="sans-serif">舍入/异常</text>
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><line x1="185" y1="118" x2="230" y2="118"/><line x1="380" y1="118" x2="425" y2="118"/><line x1="575" y1="118" x2="620" y2="118"/><line x1="770" y1="118" x2="815" y2="118"/></g>
  <text x="480" y="205" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#475569">阶码决定范围，尾数决定精度；顺序不能颠倒</text>
</svg>
