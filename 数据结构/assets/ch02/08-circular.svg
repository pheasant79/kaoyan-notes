<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-labelledby="title desc">
<title id="title">非循环与循环链表</title><desc id="desc">不带头结点时，循环链表的尾结点 C 指回 A，判断结束需检查是否回到入口。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4b8ee8"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#269c72"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d55263"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#596779"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a079ce"/></marker></defs><rect width="720" height="432" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="30" y="35" font-size="21" fill="#4b8ee8" text-anchor="start" font-weight="600">非循环：沿 next 最终遇到 NULL</text><rect x="90" y="69" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="154.48000000000002" y1="69" x2="154.48000000000002" y2="115" stroke="#4b8ee8" stroke-width="1.4"/><text x="122.24000000000001" y="100" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">A</text><text x="174.24" y="99" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="305" y="69" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="369.48" y1="69" x2="369.48" y2="115" stroke="#4b8ee8" stroke-width="1.4"/><text x="337.24" y="100" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">B</text><text x="389.24" y="99" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="520" y="69" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="584.48" y1="69" x2="584.48" y2="115" stroke="#4b8ee8" stroke-width="1.4"/><text x="552.24" y="100" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">C</text><text x="604.24" y="99" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">∅</text><path d="M 195 92 H 300" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><path d="M 410 92 H 515" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><line x1="28" y1="153" x2="692" y2="153" stroke="#dce2e9" stroke-width="1.4"/><text x="30" y="192" font-size="21" fill="#4b8ee8" text-anchor="start" font-weight="600">循环：末结点回到入口（本图不带头结点）</text><rect x="90" y="267" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="154.48000000000002" y1="267" x2="154.48000000000002" y2="313" stroke="#4b8ee8" stroke-width="1.4"/><text x="122.24000000000001" y="298" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">A</text><text x="174.24" y="297" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="305" y="267" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="369.48" y1="267" x2="369.48" y2="313" stroke="#4b8ee8" stroke-width="1.4"/><text x="337.24" y="298" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">B</text><text x="389.24" y="297" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="520" y="267" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="584.48" y1="267" x2="584.48" y2="313" stroke="#4b8ee8" stroke-width="1.4"/><text x="552.24" y="298" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">C</text><text x="604.24" y="297" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><text x="120" y="232" font-size="18" fill="#596779" text-anchor="middle" font-weight="600">入口</text><path d="M 120 239 V 262" fill="none" stroke="#596779" stroke-width="2.4" marker-end="url(#muted)"/><path d="M 195 290 H 300" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><path d="M 410 290 H 515" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><path d="M 625 290 H 660 V 359 H 57 V 290 H 85" fill="none" stroke="#269c72" stroke-width="2.4" marker-end="url(#green)"/><text x="357" y="346" font-size="18" fill="#269c72" text-anchor="middle" font-weight="600">C.next 回到 A</text><text x="30" y="407" font-size="18" fill="#596779" text-anchor="start" font-weight="400">已经访问过入口后，再次回到入口才结束本轮遍历。</text></g></svg>

