<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">非齐次方程组通解结构</title>
  <desc id="desc">非齐次方程组的通解等于一个特解加上对应齐次方程组的通解。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker></defs>
  <rect width="900" height="220" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="35" y="65" width="180" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="125" y="108" font-size="21" fill="#1E3A8A">一个特解 x₀</text>
    <line x1="218" y1="101" x2="340" y2="101" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="280" y="83" font-size="15" fill="#475569">相加</text>
    <rect x="343" y="65" width="215" height="72" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="450" y="100" font-size="19" fill="#166534">齐次通解 xₕ</text><text x="450" y="124" font-size="14" fill="#475569">基础解系的线性组合</text>
    <line x1="561" y1="101" x2="680" y2="101" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="683" y="65" width="180" height="72" rx="8" fill="#FDF4FF" stroke="#9333EA" stroke-width="2"/><text x="773" y="108" font-size="22" fill="#7E22CE">x = x₀ + xₕ</text>
  </g>
  <text x="450" y="180" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" fill="#64748B">所有非齐次解构成齐次解空间的平移，而不是任意两个解相加</text>
</svg>
