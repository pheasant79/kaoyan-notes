<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#64748b"/></marker></defs>
  <rect width="900" height="350" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb">TCP 建立与释放：双向状态变化</text>
  <text x="170" y="72" text-anchor="middle" font-size="15" font-weight="700">主动方</text><text x="730" y="72" text-anchor="middle" font-size="15" font-weight="700">被动方</text>
  <line x1="170" y1="86" x2="170" y2="300" stroke="#94a3b8" stroke-width="2"/><line x1="730" y1="86" x2="730" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
    <line x1="180" y1="110" x2="715" y2="145"/>
    <line x1="720" y1="160" x2="185" y2="195"/>
    <line x1="180" y1="210" x2="715" y2="235"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="445" y="112">SYN, seq=x</text><text x="445" y="168">SYN+ACK, seq=y, ack=x+1</text><text x="445" y="224">ACK, ack=y+1</text>
  </g>
  <rect x="335" y="255" width="230" height="34" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="450" y="277" text-anchor="middle" font-size="13">雙方進入 ESTABLISHED</text>
  <text x="450" y="322" text-anchor="middle" font-size="13" fill="#dc2626">連接释放时两个方向分别关闭；FIN 各消耗一个序号</text>
</svg>
