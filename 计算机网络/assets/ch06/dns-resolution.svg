<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330">
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#64748b"/></marker></defs>
  <rect width="900" height="330" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb">DNS 递归解析器的迭代查询</text>
  <g font-size="13" text-anchor="middle">
    <rect x="25" y="105" width="130" height="60" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="90" y="130" font-weight="700">主机</text><text x="90" y="151">请求域名</text>
    <rect x="190" y="105" width="155" height="60" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="267" y="130" font-weight="700">递归解析器</text><text x="267" y="151">查缓存/代查</text>
    <rect x="400" y="105" width="120" height="60" rx="5" fill="#f8fafc" stroke="#94a3b8"/><text x="460" y="130" font-weight="700">根服务器</text><text x="460" y="151">给出TLD线索</text>
    <rect x="570" y="105" width="120" height="60" rx="5" fill="#f8fafc" stroke="#94a3b8"/><text x="630" y="130" font-weight="700">TLD服务器</text><text x="630" y="151">给出权威线索</text>
    <rect x="740" y="105" width="130" height="60" rx="5" fill="#fef2f2" stroke="#dc2626"/><text x="805" y="130" font-weight="700">权威服务器</text><text x="805" y="151">返回资源记录</text>
  </g>
  <g stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
    <line x1="155" y1="120" x2="183" y2="120"/><line x1="345" y1="120" x2="393" y2="120"/>
    <line x1="520" y1="120" x2="563" y2="120"/><line x1="690" y1="120" x2="733" y2="120"/>
  </g>
  <path d="M267 175 C267 235 90 235 90 175" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="263" text-anchor="middle" font-size="13" fill="#9333ea">结果返回主机，缓存受 TTL 约束</text>
  <text x="540" y="225" text-anchor="middle" font-size="13" fill="#64748b">解析器代替主机迭代查询；各服务器返回下一步线索或最终记录</text>
  <text x="450" y="300" text-anchor="middle" font-size="12" fill="#dc2626">实际访问可能命中浏览器、操作系统或递归解析器缓存</text>
</svg>
