<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">CPU 数据通路</title><desc id="desc">寄存器、ALU、主存和控制器通过数据与控制路径协同。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748B"/></marker></defs><rect width="1200" height="520" fill="#F8FAFC"/><text x="45" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G5-01 CPU 数据通路</text><rect x="70" y="100" width="245" height="270" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="192" y="140" text-anchor="middle" font-size="24" fill="#1E40AF" font-weight="700">寄存器组</text><text x="192" y="190" text-anchor="middle" font-size="20" fill="#1E3A8A">PC / IR</text><text x="192" y="235" text-anchor="middle" font-size="20" fill="#1E3A8A">MAR / MDR</text><text x="192" y="280" text-anchor="middle" font-size="20" fill="#1E3A8A">R0...Rn</text><text x="192" y="325" text-anchor="middle" font-size="17" fill="#475569">保存状态与操作数</text><rect x="440" y="160" width="280" height="160" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="580" y="220" text-anchor="middle" font-size="26" fill="#166534" font-weight="700">ALU</text><text x="580" y="260" text-anchor="middle" font-size="18" fill="#475569">算术、逻辑、比较</text><rect x="850" y="100" width="250" height="270" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/><text x="975" y="145" text-anchor="middle" font-size="24" fill="#166534" font-weight="700">主存 / Cache</text><text x="975" y="210" text-anchor="middle" font-size="19" fill="#475569">指令</text><text x="975" y="255" text-anchor="middle" font-size="19" fill="#475569">操作数</text><text x="975" y="300" text-anchor="middle" font-size="19" fill="#475569">结果</text><rect x="410" y="400" width="380" height="70" rx="8" fill="#F3E8FF" stroke="#9333EA" stroke-width="3"/><text x="600" y="443" text-anchor="middle" font-size="22" fill="#7E22CE">控制器：选择、读写、装入、时序</text><line x1="315" y1="220" x2="440" y2="220" stroke="#64748B" stroke-width="5" marker-end="url(#a)"/><line x1="720" y1="220" x2="850" y2="220" stroke="#64748B" stroke-width="5" marker-end="url(#a)"/><line x1="850" y1="285" x2="315" y2="285" stroke="#0F766E" stroke-width="5" marker-end="url(#a)"/><line x1="580" y1="400" x2="580" y2="320" stroke="#9333EA" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a)"/><text x="380" y="205" font-size="16" fill="#475569">读操作数</text><text x="780" y="205" font-size="16" fill="#475569">访存</text><text x="580" y="365" text-anchor="middle" font-size="16" fill="#0F766E">写回</text></svg>
