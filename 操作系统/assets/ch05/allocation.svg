<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230"><rect width="760" height="230" fill="#fff"/><text x="380" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">文件物理分配方式</text><g font-size="13" text-anchor="middle"><text x="105" y="58">连续</text><rect x="35" y="75" width="35" height="35" fill="#bfdbfe" stroke="#2563eb"/><rect x="70" y="75" width="35" height="35" fill="#bfdbfe" stroke="#2563eb"/><rect x="105" y="75" width="35" height="35" fill="#bfdbfe" stroke="#2563eb"/><rect x="140" y="75" width="35" height="35" fill="#bfdbfe" stroke="#2563eb"/><text x="105" y="135">快，但扩展困难</text><text x="300" y="58">链接</text><rect x="230" y="75" width="45" height="35" fill="#dcfce7" stroke="#16a34a"/><rect x="330" y="75" width="45" height="35" fill="#dcfce7" stroke="#16a34a"/><rect x="280" y="75" width="45" height="35" fill="#dcfce7" stroke="#16a34a"/><path d="M275 92 H278 M325 92 H328" stroke="#16a34a" stroke-width="2"/><text x="300" y="135">易扩展，随机访问慢</text><text x="545" y="58">索引</text><rect x="470" y="75" width="95" height="35" fill="#fef3c7" stroke="#d97706"/><text x="517" y="98">索引块</text><rect x="600" y="75" width="42" height="35" fill="#f0fdf4" stroke="#16a34a"/><rect x="650" y="75" width="42" height="35" fill="#f0fdf4" stroke="#16a34a"/><path d="M565 92 H595 M565 92 L650 92" stroke="#d97706" stroke-width="2"/><text x="580" y="135">支持随机定位</text></g><text x="380" y="185" text-anchor="middle" font-size="12" fill="#64748b">三种方式都描述逻辑文件块到物理块的映射</text><text x="380" y="208" text-anchor="middle" font-size="12" fill="#dc2626">索引块本身也占用外存访问</text></svg>
