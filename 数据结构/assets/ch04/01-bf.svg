<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <rect width="720" height="360" fill="#ffffff"/>
  <style>
    .cell{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.hot{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.good{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}
    .t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:20px;fill:#1f2937;text-anchor:middle}.s{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:17px;fill:#475569;text-anchor:middle}
  </style>
  <text x="360" y="30" class="t">BF：T=ababac，P=ababb，第五位失配后起点右移</text>
  <text x="72" y="82" class="s">T</text><text x="72" y="137" class="s">P</text>
  <g transform="translate(105 55)">
    <g><rect x="0" y="0" width="62" height="48" class="cell"/><text x="31" y="32" class="t">a</text><rect x="62" y="0" width="62" height="48" class="cell"/><text x="93" y="32" class="t">b</text><rect x="124" y="0" width="62" height="48" class="cell"/><text x="155" y="32" class="t">a</text><rect x="186" y="0" width="62" height="48" class="cell"/><text x="217" y="32" class="t">b</text><rect x="248" y="0" width="62" height="48" class="hot"/><text x="279" y="32" class="t">a</text><rect x="310" y="0" width="62" height="48" class="cell"/><text x="341" y="32" class="t">c</text></g>
    <g transform="translate(0 55)"><rect x="0" y="0" width="62" height="48" class="good"/><text x="31" y="32" class="t">a</text><rect x="62" y="0" width="62" height="48" class="good"/><text x="93" y="32" class="t">b</text><rect x="124" y="0" width="62" height="48" class="good"/><text x="155" y="32" class="t">a</text><rect x="186" y="0" width="62" height="48" class="good"/><text x="217" y="32" class="t">b</text><rect x="248" y="0" width="62" height="48" class="hot"/><text x="279" y="32" class="t">b</text></g>
    <g transform="translate(62 145)"><rect x="0" y="0" width="62" height="48" class="hot"/><text x="31" y="32" class="t">a</text><text x="130" y="34" class="s">新起点：T[1]=b，对 P[0]=a</text></g>
  </g>
  <text x="520" y="285" class="s">前四位 abab 匹配，第五位 a ≠ b</text><text x="520" y="315" class="s" fill="#dc2626">起点右移后，从 P[0] 重新比较</text>
</svg>

