<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">同一棵二叉树的四种遍历次序</title>
  <desc id="desc">左侧为根 A、左右子树分别含 B、C 的二叉树；右侧列出先序、中序、后序和层序结果。</desc>
  <rect width="640" height="320" fill="#FFFFFF"/>
  <text x="160" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1F2937">同一棵二叉树</text>
  <text x="430" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1F2937">访问规则不同，序列不同</text>
  <g fill="none" stroke="#9CA3AF" stroke-width="2">
    <path d="M160 75 L95 132 M160 75 L225 132"/>
    <path d="M95 158 L62 215 M95 158 L128 215"/>
    <path d="M225 158 L192 215"/>
  </g>
  <g fill="#FFFFFF" stroke="#4B8EE8" stroke-width="2">
    <circle cx="160" cy="63" r="18"/><circle cx="95" cy="146" r="18"/><circle cx="225" cy="146" r="18"/>
    <circle cx="62" cy="231" r="18"/><circle cx="128" cy="231" r="18"/><circle cx="192" cy="231" r="18"/>
  </g>
  <g font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#111827">
    <text x="160" y="63">A</text><text x="95" y="146">B</text><text x="225" y="146">C</text>
    <text x="62" y="231">D</text><text x="128" y="231">E</text><text x="192" y="231">F</text>
  </g>
  <g font-family="sans-serif" font-size="17" fill="#374151">
    <text x="340" y="92">先序</text><text x="410" y="92" fill="#269C72">A B D E C F</text>
    <text x="340" y="137">中序</text><text x="410" y="137" fill="#269C72">D B E A F C</text>
    <text x="340" y="182">后序</text><text x="410" y="182" fill="#269C72">D E B F C A</text>
    <text x="340" y="227">层序</text><text x="410" y="227" fill="#269C72">A B C D E F</text>
  </g>
  <text x="340" y="278" font-family="sans-serif" font-size="14" fill="#6B7280">T = 根，L = 左子树，R = 右子树</text>
</svg>
