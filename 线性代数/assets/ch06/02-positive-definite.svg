<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">正定性判断关系</title>
  <desc id="desc">对实对称矩阵，二次型定义、正特征值和正顺序主子式是等价的正定性判据。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker></defs>
  <rect width="960" height="230" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="35" y="70" width="250" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="160" y="104" font-size="18" fill="#1E3A8A">定义：xᵀAx&gt;0</text><text x="160" y="130" font-size="14" fill="#475569">对所有非零 x</text>
    <line x1="290" y1="109" x2="370" y2="109" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="373" y="70" width="210" height="78" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="478" y="104" font-size="18" fill="#166534">特征值全为正</text><text x="478" y="130" font-size="14" fill="#475569">实对称矩阵</text>
    <line x1="588" y1="109" x2="668" y2="109" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="671" y="70" width="250" height="78" rx="8" fill="#FDF4FF" stroke="#9333EA" stroke-width="2"/><text x="796" y="104" font-size="18" fill="#7E22CE">顺序主子式全为正</text><text x="796" y="130" font-size="14" fill="#475569">Sylvester 判据</text>
  </g>
  <text x="480" y="190" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" fill="#DC2626">三个判据等价的前提：矩阵必须是实对称矩阵</text>
</svg>
