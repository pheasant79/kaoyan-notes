<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">散列表冲突处理</title>
  <desc id="desc">18、28、38 映射到同一初始地址，开放定址继续探测，链地址挂接在同一桶。</desc>
  <rect width="900" height="470" fill="#FFFFFF"/>
  <style>
    .slot{fill:#EFF6FF;stroke:#4b8ee8;stroke-width:2}
    .used{fill:#DCFCE7;stroke:#269c72;stroke-width:2}
    .mark{fill:#FEE2E2;stroke:#d55263;stroke-width:2}
    .edge{stroke:#6B7280;stroke-width:2;fill:none}
    .dash{stroke:#d55263;stroke-width:2;stroke-dasharray:6 5;fill:none}
    .label{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:20px;fill:#1F2937;text-anchor:middle}
    .small{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:17px;fill:#4B5563}
  </style>
  <text x="35" y="35" class="small">18、28、38 的初始地址均为 2：冲突必须由统一的探测或链接规则解决</text>
  <text x="55" y="80" class="small">开放定址：探测下一个槽位</text>
  <g transform="translate(55 105)">
    <rect x="0" y="0" width="78" height="54" class="slot"/><text x="39" y="35" class="label">0</text>
    <rect x="78" y="0" width="78" height="54" class="slot"/><text x="117" y="35" class="label">1</text>
    <rect x="156" y="0" width="78" height="54" class="used"/><text x="195" y="35" class="label">18</text>
    <rect x="234" y="0" width="78" height="54" class="used"/><text x="273" y="35" class="label">28</text>
    <rect x="312" y="0" width="78" height="54" class="used"/><text x="351" y="35" class="label">38</text>
    <rect x="390" y="0" width="78" height="54" class="slot"/><text x="429" y="35" class="label">5</text>
    <rect x="468" y="0" width="78" height="54" class="slot"/><text x="507" y="35" class="label">6</text>
    <text x="195" y="84" class="small" text-anchor="middle">h(key)=2</text>
    <path d="M195 66 C225 92 260 92 273 66 M273 66 C305 92 338 92 351 66" class="dash"/>
    <text x="0" y="113" class="small">线性探测：冲突后继续检查槽位</text>
  </g>
  <text x="600" y="80" class="small">链地址：同一桶连接记录</text>
  <g transform="translate(590 113)">
    <rect x="0" y="0" width="95" height="54" class="slot"/><text x="48" y="35" class="label">桶 2</text>
    <path d="M95 27 L135 27" class="edge"/>
    <circle cx="175" cy="27" r="27" class="used"/><text x="175" y="34" class="label">18</text>
    <path d="M202 27 L242 27" class="edge"/>
    <circle cx="282" cy="27" r="27" class="used"/><text x="282" y="34" class="label">28</text>
    <path d="M309 27 L349 27" class="edge"/>
    <circle cx="389" cy="27" r="27" class="used"/><text x="389" y="34" class="label">38</text>
    <text x="195" y="95" class="small" text-anchor="middle">桶内再顺序查找或使用其他容器</text>
  </g>
  <line x1="35" y1="290" x2="865" y2="290" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="35" y="330" class="small">删除提示：</text>
  <rect x="160" y="298" width="85" height="52" class="mark"/><text x="202" y="332" class="label">删除</text>
  <text x="265" y="330" class="small">开放定址中不能把已用槽简单清空，否则可能截断后续探测路径；应使用删除标记或重散列。</text>
  <text x="35" y="405" class="small">装填因子 α = 记录数 / 槽位数；α 越高，开放定址的探测链通常越长。</text>
</svg>

