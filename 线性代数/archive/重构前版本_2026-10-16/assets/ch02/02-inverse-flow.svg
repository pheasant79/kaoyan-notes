<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">增广矩阵求逆</title>
  <desc id="desc">把矩阵 A 与单位矩阵 I 拼成增广矩阵，通过行变换得到单位矩阵 I 与逆矩阵 A 的逆。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker></defs>
  <rect width="900" height="210" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="58" y="55" width="245" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="180" y="92" font-size="22" fill="#1E3A8A">( A | I )</text><text x="180" y="124" font-size="14" fill="#475569">左边是待求矩阵，右边是单位矩阵</text>
    <line x1="306" y1="105" x2="594" y2="105" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="450" y="82" font-size="15" fill="#166534">初等行变换</text><text x="450" y="137" font-size="13" fill="#475569">左侧化为 I，右侧同步变化</text>
    <rect x="597" y="55" width="245" height="100" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="720" y="92" font-size="22" fill="#166534">( I | A⁻¹ )</text><text x="720" y="124" font-size="14" fill="#475569">右侧即为逆矩阵</text>
  </g>
  <text x="450" y="184" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#DC2626">前提：A 必须是可逆方阵；否则左侧无法化为 I</text>
</svg>
