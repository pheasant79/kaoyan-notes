<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" role="img" aria-labelledby="title desc">
<title id="title">位序与数组下标</title><desc id="desc">A、B、C 的逻辑次序与从零开始的数组下标对应；B 的位序为二，下标为一。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4b8ee8"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#269c72"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d55263"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#596779"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a079ce"/></marker></defs><rect width="720" height="316" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="30" y="36" font-size="22" fill="#4b8ee8" text-anchor="start" font-weight="600">先看逻辑次序，再对应存储下标</text><rect x="140" y="74" width="100" height="54" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><text x="190" y="110" font-size="25" fill="#233246" text-anchor="middle" font-weight="600">A</text><text x="190" y="188" font-size="22" fill="#233246" text-anchor="middle" font-weight="400">1</text><text x="190" y="234" font-size="22" fill="#233246" text-anchor="middle" font-weight="400">0</text><rect x="310" y="74" width="100" height="54" rx="3" fill="#e3f5eb" stroke="#269c72" stroke-width="1.6"/><text x="360" y="110" font-size="25" fill="#233246" text-anchor="middle" font-weight="600">B</text><text x="360" y="188" font-size="22" fill="#233246" text-anchor="middle" font-weight="400">2</text><text x="360" y="234" font-size="22" fill="#233246" text-anchor="middle" font-weight="400">1</text><rect x="480" y="74" width="100" height="54" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><text x="530" y="110" font-size="25" fill="#233246" text-anchor="middle" font-weight="600">C</text><text x="530" y="188" font-size="22" fill="#233246" text-anchor="middle" font-weight="400">3</text><text x="530" y="234" font-size="22" fill="#233246" text-anchor="middle" font-weight="400">2</text><path d="M 244 101 H 302" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><path d="M 414 101 H 472" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><text x="190" y="154" font-size="18" fill="#596779" text-anchor="middle" font-weight="400">B 的前驱</text><text x="530" y="154" font-size="18" fill="#596779" text-anchor="middle" font-weight="400">B 的后继</text><text x="30" y="188" font-size="18" fill="#233246" text-anchor="start" font-weight="400">位序</text><text x="30" y="234" font-size="18" fill="#233246" text-anchor="start" font-weight="400">数组下标</text><line x1="28" y1="258" x2="692" y2="258" stroke="#dce2e9" stroke-width="1.4"/><text x="30" y="292" font-size="18" fill="#596779" text-anchor="start" font-weight="400">箭头只表示先后关系；这里还没有选择顺序表或链表。</text></g></svg>

