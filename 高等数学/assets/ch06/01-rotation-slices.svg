<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <rect width="900" height="350" fill="white"/>
  <text x="34" y="34" fill="#0F172A" font-size="23" font-weight="bold">旋转体：切片方向决定微元形状</text>
  <g transform="translate(35,65)">
    <text x="130" y="20" fill="#2563EB" font-size="20" font-weight="bold">垂直于旋转轴：圆盘/环片</text>
    <line x1="180" y1="45" x2="180" y2="255" stroke="#64748B" stroke-width="2"/>
    <path d="M180 55 C255 70 300 105 320 150 C300 195 255 230 180 245" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
    <ellipse cx="245" cy="150" rx="48" ry="18" fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/>
    <line x1="245" y1="132" x2="245" y2="168" stroke="#DC2626" stroke-width="3"/>
    <text x="270" y="145" fill="#DC2626" font-size="17">dx</text>
    <text x="75" y="285" fill="#334155" font-size="17">半径平方相减：π(R²-r²)dx</text>
  </g>
  <g transform="translate(485,65)">
    <text x="70" y="20" fill="#16A34A" font-size="20" font-weight="bold">平行于旋转轴：柱壳</text>
    <line x1="70" y1="245" x2="335" y2="245" stroke="#64748B" stroke-width="2"/>
    <path d="M95 220 C150 190 185 125 230 80 C270 55 310 80 335 105" fill="none" stroke="#16A34A" stroke-width="3"/>
    <rect x="190" y="125" width="18" height="120" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <line x1="199" y1="245" x2="199" y2="270" stroke="#DC2626" stroke-width="3"/>
    <text x="190" y="290" fill="#DC2626" font-size="17">dx</text>
    <line x1="199" y1="125" x2="199" y2="80" stroke="#9333EA" stroke-width="2"/>
    <text x="212" y="105" fill="#9333EA" font-size="17">高 h(x)</text>
    <text x="65" y="315" fill="#334155" font-size="17">半径 × 高 × 厚度：2πx·h(x)dx</text>
  </g>
</svg>
