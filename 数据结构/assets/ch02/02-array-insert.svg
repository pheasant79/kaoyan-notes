-width="1.6"/><text x="209" y="510" font-size="23" fill="#4b8ee8" text-anchor="middle" font-weight="600">A</text><text x="209" y="550" font-size="17" fill="#596779" text-anchor="middle" font-weight="400">0</text><rect x="256" y="478" width="94" height="48" rx="3" fill="#e3f5eb" stroke="#269c72" stroke-width="1.6"/><text x="303" y="510" font-size="23" fill="#269c72" text-anchor="middle" font-weight="600">X</text><text x="303" y="550" font-size="17" fill="#596779" text-anchor="middle" font-weight="400">1</text><rect x="350" y="478" width="94" height="48" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><text x="397" y="510" font-size="23" fill="#4b8ee8" text-anchor="middle" font-weight="600">B</text><text x="397" y="550" font-size="17" fill="#596779" text-anchor="middle" font-weight="400">2</text><rect x="444" y="478" width="94" height="48" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><text x="491" y="510" font-size="23" fill="#4b8ee8" text-anchor="middle" font-weight="600">C</text><text x="491" y="550" font-size="17" fill="#596779" text-anchor="middle" font-weight="400">3</text><rect x="538" y="478" width="94" height="48" rx="3" fill="#f0f2f5" stroke="#596779" stroke-width="1.6" stroke-dasharray="5 4"/><text x="585" y="510" font-size="17" fill="#596779" text-anchor="middle" font-weight="400">空</text><text x="585" y="550" font-size="17" fill="#596779" text-anchor="middle" font-weight="400">4</text><text x="90" y="550" font-size="17" fill="#596779" text-anchor="start" font-weight="400">下标</text><text x="30" y="587" font-size="18" fill="#596779" text-anchor="start" font-weight="400">虚线格是暂存副本，尚不计入表长；写入 X 后表长才增至 4。</text><text x="30" y="620" font-size="18" fill="#233246" text-anchor="start" font-weight="400">移动范围：原位置 2～3，共 2 个元素。</text></g></svg>

