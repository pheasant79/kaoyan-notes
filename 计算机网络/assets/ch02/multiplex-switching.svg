    <text x="122" y="235" fill="#64748b">频率/时隙/波长/码</text>
    <rect x="265" y="75" width="175" height="185" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="352" y="101" font-weight="700">电路交换</text><text x="352" y="145">建立专用通路</text><text x="352" y="175">持续占用资源</text><text x="352" y="223" fill="#16a34a">路径先建立</text>
