<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" role="img" aria-labelledby="title desc"><title id="title">指令周期阶段</title><desc id="desc">IF、ID、EX、MEM、WB 五个阶段组成典型流水线。</desc><rect width="1180" height="300" fill="#FFFFFF"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G5-02 一条指令的阶段</text><g font-size="21" text-anchor="middle"><rect x="55" y="105" width="180" height="75" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="145" y="150" fill="#1E40AF">IF 取指</text><rect x="265" y="105" width="180" height="75" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><text x="355" y="150" fill="#854D0E">ID 译码</text><rect x="475" y="105" width="180" height="75" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="565" y="150" fill="#166534">EX 执行</text><rect x="685" y="105" width="180" height="75" fill="#F3E8FF" stroke="#9333EA" stroke-width="3"/><text x="775" y="150" fill="#7E22CE">MEM 访存</text><rect x="895" y="105" width="180" height="75" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="985" y="150" fill="#1E40AF">WB 写回</text></g><g stroke="#64748B" stroke-width="4"><line x1="235" y1="142" x2="265" y2="142"/><line x1="445" y1="142" x2="475" y2="142"/><line x1="655" y1="142" x2="685" y2="142"/><line x1="865" y1="142" x2="895" y2="142"/></g><text x="55" y="235" font-size="19" fill="#475569">并非每条指令都需要实际 MEM 访问；Load/Store 在该阶段使用主存或 Cache。</text></svg>
