<svg xmlns="http://www.w3.org/2000/svg" width="720" height="615" viewBox="0 0 720 615" role="img" aria-labelledby="title desc">
<title id="title">单链表删除时先绕过再回收</title><desc id="desc">q 保存 X；A 的后继改为 B；X 脱离主链后再回收。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4b8ee8"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#269c72"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d55263"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#596779"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a079ce"/></marker></defs><rect width="720" height="615" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="30" y="32" font-size="20" fill="#269c72" text-anchor="start" font-weight="600">① 保存目标：q = p.next</text><rect x="38" y="94" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="102.48" y1="94" x2="102.48" y2="140" stroke="#4b8ee8" stroke-width="1.4"/><text x="70.24000000000001" y="125" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">A</text><text x="122.24000000000001" y="124" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="360" y="94" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="424.48" y1="94" x2="424.48" y2="140" stroke="#4b8ee8" stroke-width="1.4"/><text x="392.24" y="125" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">B</text><text x="444.24" y="124" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="548" y="94" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="612.48" y1="94" x2="612.48" y2="140" stroke="#4b8ee8" stroke-width="1.4"/><text x="580.24" y="125" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">C</text><text x="632.24" y="124" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">∅</text><text x="68" y="59" font-size="18" fill="#596779" text-anchor="middle" font-weight="600">p</text><path d="M 68 66 V 89" fill="none" stroke="#596779" stroke-width="2.4" marker-end="url(#muted)"/><path d="M 465 117 H 543" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><rect x="204" y="94" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="268.48" y1="94" x2="268.48" y2="140" stroke="#4b8ee8" stroke-width="1.4"/><text x="236.24" y="125" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">X</text><text x="288.24" y="124" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><text x="236" y="59" font-size="18" fill="#596779" text-anchor="middle" font-weight="600">q</text><path d="M 236 66 V 89" fill="none" stroke="#596779" stroke-width="2.4" marker-end="url(#muted)"/><path d="M 309 117 H 355" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><path d="M 143 117 H 199" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><line x1="28" y1="191" x2="692" y2="191" stroke="#dce2e9" stroke-width="1.4"/><text x="30" y="219" font-size="20" fill="#269c72" text-anchor="start" font-weight="600">② 绕过 X：p.next = q.next</text><rect x="38" y="281" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="102.48" y1="281" x2="102.48" y2="327" stroke="#4b8ee8" stroke-width="1.4"/><text x="70.24000000000001" y="312" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">A</text><text x="122.24000000000001" y="311" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="360" y="281" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="424.48" y1="281" x2="424.48" y2="327" stroke="#4b8ee8" stroke-width="1.4"/><text x="392.24" y="312" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">B</text><text x="444.24" y="311" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="548" y="281" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="612.48" y1="281" x2="612.48" y2="327" stroke="#4b8ee8" stroke-width="1.4"/><text x="580.24" y="312" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">C</text><text x="632.24" y="311" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">∅</text><text x="68" y="246" font-size="18" fill="#596779" text-anchor="middle" font-weight="600">p</text><path d="M 68 253 V 276" fill="none" stroke="#596779" stroke-width="2.4" marker-end="url(#muted)"/><path d="M 465 304 H 543" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><rect x="204" y="281" width="104" height="46" rx="3" fill="#fff0f1" stroke="#d55263" stroke-width="1.6"/><line x1="268.48" y1="281" x2="268.48" y2="327" stroke="#d55263" stroke-width="1.4"/><text x="236.24" y="312" font-size="22" fill="#d55263" text-anchor="middle" font-weight="600">X</text><text x="288.24" y="311" font-size="18" fill="#d55263" text-anchor="middle" font-weight="400">•</text><text x="236" y="246" font-size="18" fill="#d55263" text-anchor="middle" font-weight="600">q</text><path d="M 236 253 V 276" fill="none" stroke="#d55263" stroke-width="2.4" marker-end="url(#red)"/><path d="M 309 304 H 355" fill="none" stroke="#596779" stroke-width="2.4" marker-end="url(#muted)" stroke-dasharray="6 4"/><path d="M 143 304 H 169 V 350 H 336 V 304 H 355" fill="none" stroke="#269c72" stroke-width="2.4" marker-end="url(#green)"/><text x="370" y="352" font-size="17" fill="#d55263" text-anchor="start" font-weight="400">X 仍由 q 保存</text><line x1="28" y1="378" x2="692" y2="378" stroke="#dce2e9" stroke-width="1.4"/><text x="30" y="406" font-size="20" fill="#d55263" text-anchor="start" font-weight="600">③ 回收 X：此后不再通过 q 访问它</text><rect x="38" y="468" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="102.48" y1="468" x2="102.48" y2="514" stroke="#4b8ee8" stroke-width="1.4"/><text x="70.24000000000001" y="499" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">A</text><text x="122.24000000000001" y="498" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="360" y="468" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="424.48" y1="468" x2="424.48" y2="514" stroke="#4b8ee8" stroke-width="1.4"/><text x="392.24" y="499" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">B</text><text x="444.24" y="498" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">•</text><rect x="548" y="468" width="104" height="46" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="612.48" y1="468" x2="612.48" y2="514" stroke="#4b8ee8" stroke-width="1.4"/><text x="580.24" y="499" font-size="22" fill="#4b8ee8" text-anchor="middle" font-weight="600">C</text><text x="632.24" y="498" font-size="18" fill="#4b8ee8" text-anchor="middle" font-weight="400">∅</text><text x="68" y="433" font-size="18" fill="#596779" text-anchor="middle" font-weight="600">p</text><path d="M 68 440 V 463" fill="none" stroke="#596779" stroke-width="2.4" marker-end="url(#muted)"/><path d="M 465 491 H 543" fill="none" stroke="#4b8ee8" stroke-width="2.4" marker-end="url(#blue)"/><rect x="204" y="468" width="104" height="46" rx="3" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6" stroke-dasharray="5 4"/><text x="256" y="498" font-size="18" fill="#596779" text-anchor="middle" font-weight="400">已回收</text><path d="M 143 491 H 169 V 537 H 336 V 491 H 355" fill="none" stroke="#269c72" stroke-width="2.4" marker-end="url(#green)"/><text x="30" y="591" font-size="18" fill="#596779" text-anchor="start" font-weight="400">已知前驱 p：摘除为 O(1)；若先找 p，还需计入查找成本。</text></g></svg>

