<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310">
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#64748b"/></marker></defs>
  <rect width="900" height="310" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb">帧结构与 CRC 检错</text>
  <g font-size="14" text-anchor="middle">
    <rect x="55" y="84" width="190" height="62" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="150" y="110" font-weight="700">帧首部</text><text x="150" y="132">地址 / 控制 / 定界</text>
    <rect x="245" y="84" width="420" height="62" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="455" y="110" font-weight="700">数据部分</text><text x="455" y="132">网络层 IP 数据报</text>
    <rect x="665" y="84" width="180" height="62" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="755" y="110" font-weight="700">CRC 字段</text><text x="755" y="132">检错余数</text>
  </g>
  <rect x="105" y="190" width="290" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="250" y="216" text-anchor="middle" font-size="14">发送端：数据后补 r 个 0</text>
  <text x="250" y="238" text-anchor="middle" font-size="14">模 2 除法 → 余数</text>
  <line x1="395" y1="220" x2="485" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="495" y="190" width="300" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="645" y="216" text-anchor="middle" font-size="14">接收端：重新计算余数</text>
  <text x="645" y="238" text-anchor="middle" font-size="14">非零 → 检测到差错</text>
  <text x="450" y="286" text-anchor="middle" font-size="13" fill="#dc2626">检错与纠错不同；重传由 ARQ 等可靠传输机制决定</text>
</svg>
