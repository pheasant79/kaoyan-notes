<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc"><title id="title">I/O 接口关系</title><desc id="desc">外设通过数据、状态、控制寄存器与 CPU 和主存交换信息。</desc><rect width="1120" height="350" fill="#FFFFFF"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G7-01 外设为什么需要 I/O 接口</text><rect x="60" y="105" width="230" height="110" rx="8" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><text x="175" y="150" text-anchor="middle" font-size="24" fill="#854D0E">外设</text><text x="175" y="181" text-anchor="middle" font-size="17" fill="#475569">速度/格式各异</text><rect x="420" y="75" width="300" height="170" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="570" y="115" text-anchor="middle" font-size="24" fill="#1E40AF">I/O 接口</text><text x="570" y="155" text-anchor="middle" font-size="18" fill="#475569">数据寄存器</text><text x="570" y="185" text-anchor="middle" font-size="18" fill="#475569">状态寄存器</text><text x="570" y="215" text-anchor="middle" font-size="18" fill="#475569">控制寄存器</text><rect x="850" y="105" width="210" height="110" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="955" y="150" text-anchor="middle" font-size="24" fill="#166534">CPU/主存</text><text x="955" y="181" text-anchor="middle" font-size="17" fill="#475569">总线与控制</text><line x1="290" y1="160" x2="420" y2="160" stroke="#64748B" stroke-width="5"/><line x1="720" y1="160" x2="850" y2="160" stroke="#64748B" stroke-width="5"/><text x="355" y="142" text-anchor="middle" font-size="16" fill="#475569">设备侧握手</text><text x="785" y="142" text-anchor="middle" font-size="16" fill="#475569">总线侧访问</text><text x="60" y="300" font-size="19" fill="#475569">接口把“设备世界”和“主机世界”分隔开，并提供缓冲、状态和控制。</text></svg>
