<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc"><title id="title">DMA 数据通路</title><desc id="desc">CPU 初始化 DMA，DMA 取得总线后在设备和主存间直接搬运。</desc><rect width="1180" height="360" fill="#FFFFFF"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G7-03 DMA 的数据搬运路径</text><rect x="60" y="100" width="220" height="100" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="170" y="140" text-anchor="middle" font-size="22" fill="#1E40AF">CPU</text><text x="170" y="170" text-anchor="middle" font-size="17" fill="#475569">初始化/完成中断</text><rect x="470" y="80" width="250" height="140" rx="8" fill="#F3E8FF" stroke="#9333EA" stroke-width="3"/><text x="595" y="125" text-anchor="middle" font-size="22" fill="#7E22CE">DMA 控制器</text><text x="595" y="160" text-anchor="middle" font-size="17" fill="#475569">地址、计数、方向</text><text x="595" y="190" text-anchor="middle" font-size="17" fill="#475569">申请并获得总线</text><rect x="880" y="100" width="220" height="100" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="990" y="140" text-anchor="middle" font-size="22" fill="#166534">主存</text><text x="990" y="170" text-anchor="middle" font-size="17" fill="#475569">连续数据块</text><rect x="470" y="275" width="250" height="50" rx="8" fill="#FEF3C7" stroke="#CA8A04" stroke-width="2"/><text x="595" y="307" text-anchor="middle" font-size="18" fill="#854D0E">外设数据端</text><line x1="280" y1="150" x2="470" y2="150" stroke="#9333EA" stroke-width="4"/><line x1="720" y1="150" x2="880" y2="150" stroke="#16A34A" stroke-width="5"/><line x1="595" y1="220" x2="595" y2="275" stroke="#CA8A04" stroke-width="4"/><text x="375" y="132" text-anchor="middle" font-size="16" fill="#7E22CE">配置/状态</text><text x="800" y="132" text-anchor="middle" font-size="16" fill="#166534">总线数据</text><text x="40" y="350" font-size="18" fill="#B91C1C">DMA 减少 CPU 搬运，但仍占用总线，并可能涉及 Cache 一致性。</text></svg>
