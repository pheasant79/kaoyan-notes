<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">正定性的等价判据</title>
  <desc id="desc">在实对称矩阵前提下，二次型定义、全部特征值为正、顺序主子式全为正和标准形全部对角系数为正彼此等价。</desc>
  <rect width="960" height="300" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="335" y="24" width="290" height="58" rx="8" fill="#FFF7ED" stroke="#CA8A04" stroke-width="2"/>
    <text x="480" y="59" font-size="16" fill="#92400E">共同前提：A 为实对称矩阵</text>

    <rect x="35" y="150" width="205" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="137" y="184" font-size="17" fill="#1E3A8A">定义</text>
    <text x="137" y="211" font-size="14" fill="#475569">xᵀAx&gt;0（x≠0）</text>

    <rect x="270" y="150" width="205" height="82" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="372" y="184" font-size="17" fill="#166534">特征值全为正</text>
    <text x="372" y="211" font-size="14" fill="#475569">λ₁,…,λₙ&gt;0</text>

    <rect x="505" y="150" width="205" height="82" rx="8" fill="#FDF4FF" stroke="#9333EA" stroke-width="2"/>
    <text x="607" y="184" font-size="17" fill="#7E22CE">顺序主子式全为正</text>
    <text x="607" y="211" font-size="14" fill="#475569">Sylvester 判据</text>

    <rect x="740" y="150" width="185" height="82" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="832" y="184" font-size="17" fill="#334155">标准形</text>
    <text x="832" y="211" font-size="14" fill="#475569">全部 dᵢ&gt;0</text>

    <text x="255" y="196" font-size="25" fill="#64748B">⇔</text>
    <text x="490" y="196" font-size="25" fill="#64748B">⇔</text>
    <text x="725" y="196" font-size="25" fill="#64748B">⇔</text>
  </g>
  <text x="480" y="270" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#DC2626">出现零系数只能说明半正定或退化候选，不能判为正定</text>
</svg>
