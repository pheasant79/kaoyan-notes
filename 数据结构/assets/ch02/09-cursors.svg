<svg xmlns="http://www.w3.org/2000/svg" width="720" height="459" viewBox="0 0 720 459" role="img" aria-labelledby="title desc">
<title id="title">游标链表的物理位置与逻辑访问</title><desc id="desc">A 位于二号槽且 next 为四，B 位于四号槽且 next 为一，C 位于一号槽且 next 为负一。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4b8ee8"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#269c72"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d55263"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#596779"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a079ce"/></marker></defs><rect width="720" height="459" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="30" y="35" font-size="22" fill="#4b8ee8" text-anchor="start" font-weight="600">物理位置连续，逻辑次序靠游标串起来</text><text x="35" y="92" font-size="18" fill="#596779" text-anchor="start" font-weight="400">数组下标</text><text x="35" y="143" font-size="18" fill="#596779" text-anchor="start" font-weight="400">数据域</text><text x="35" y="192" font-size="18" fill="#596779" text-anchor="start" font-weight="400">next 游标</text><text x="206" y="92" font-size="20" fill="#596779" text-anchor="middle" font-weight="400">0</text><rect x="156" y="110" width="100" height="96" rx="3" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="156" y1="158" x2="256" y2="158" stroke="#8a97a6" stroke-width="1.4"/><text x="206" y="142" font-size="17" fill="#596779" text-anchor="middle" font-weight="600">空闲</text><text x="206" y="190" font-size="21" fill="#233246" text-anchor="middle" font-weight="400">—</text><text x="306" y="92" font-size="20" fill="#596779" text-anchor="middle" font-weight="400">1</text><rect x="256" y="110" width="100" height="96" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="256" y1="158" x2="356" y2="158" stroke="#8a97a6" stroke-width="1.4"/><text x="306" y="142" font-size="24" fill="#4b8ee8" text-anchor="middle" font-weight="600">C</text><text x="306" y="190" font-size="21" fill="#233246" text-anchor="middle" font-weight="400">-1</text><text x="406" y="92" font-size="20" fill="#596779" text-anchor="middle" font-weight="400">2</text><rect x="356" y="110" width="100" height="96" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="356" y1="158" x2="456" y2="158" stroke="#8a97a6" stroke-width="1.4"/><text x="406" y="142" font-size="24" fill="#4b8ee8" text-anchor="middle" font-weight="600">A</text><text x="406" y="190" font-size="21" fill="#233246" text-anchor="middle" font-weight="400">4</text><text x="506" y="92" font-size="20" fill="#596779" text-anchor="middle" font-weight="400">3</text><rect x="456" y="110" width="100" height="96" rx="3" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="456" y1="158" x2="556" y2="158" stroke="#8a97a6" stroke-width="1.4"/><text x="506" y="142" font-size="17" fill="#596779" text-anchor="middle" font-weight="600">空闲</text><text x="506" y="190" font-size="21" fill="#233246" text-anchor="middle" font-weight="400">—</text><text x="606" y="92" font-size="20" fill="#596779" text-anchor="middle" font-weight="400">4</text><rect x="556" y="110" width="100" height="96" rx="3" fill="#eaf3ff" stroke="#4b8ee8" stroke-width="1.6"/><line x1="556" y1="158" x2="656" y2="158" stroke="#8a97a6" stroke-width="1.4"/><text x="606" y="142" font-size="24" fill="#4b8ee8" text-anchor="middle" font-weight="600">B</text><text x="606" y="190" font-size="21" fill="#233246" text-anchor="middle" font-weight="400">1</text><line x1="28" y1="232" x2="692" y2="232" stroke="#dce2e9" stroke-width="1.4"/><text x="30" y="268" font-size="21" fill="#269c72" text-anchor="start" font-weight="600">逻辑访问：head = 2，从 A 开始</text><rect x="80" y="297" width="122" height="56" rx="3" fill="#e3f5eb" stroke="#269c72" stroke-width="1.6"/><text x="141" y="332" font-size="22" fill="#269c72" text-anchor="middle" font-weight="600">A [2]</text><rect x="268" y="297" width="122" height="56" rx="3" fill="#e3f5eb" stroke="#269c72" stroke-width="1.6"/><text x="329" y="332" font-size="22" fill="#269c72" text-anchor="middle" font-weight="600">B [4]</text><rect x="456" y="297" width="122" height="56" rx="3" fill="#e3f5eb" stroke="#269c72" stroke-width="1.6"/><text x="517" y="332" font-size="22" fill="#269c72" text-anchor="middle" font-weight="600">C [1]</text><path d="M 204 325 H 263" fill="none" stroke="#269c72" stroke-width="2.4" marker-end="url(#green)"/><path d="M 392 325 H 451" fill="none" stroke="#269c72" stroke-width="2.4" marker-end="url(#green)"/><path d="M 580 325 H 626" fill="none" stroke="#269c72" stroke-width="2.4" marker-end="url(#green)"/><text x="660" y="332" font-size="22" fill="#596779" text-anchor="middle" font-weight="400">-1</text><text x="30" y="399" font-size="18" fill="#596779" text-anchor="start" font-weight="400">找第 2 个元素：从下标 2 读取 next = 4，再到下标 4 取 B。</text><text x="30" y="433" font-size="18" fill="#596779" text-anchor="start" font-weight="400">本图约定 -1 表示结束；空闲位置 0、3 需要另行管理。</text></g></svg>

