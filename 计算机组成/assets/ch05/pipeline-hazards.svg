<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 350" role="img" aria-labelledby="title desc"><title id="title">流水线冒险</title><desc id="desc">结构、数据、控制冒险分别由资源冲突、依赖和分支造成。</desc><rect width="1180" height="350" fill="#F8FAFC"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G5-03 流水线为什么会停顿</text><rect x="55" y="100" width="320" height="150" rx="8" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><text x="215" y="140" text-anchor="middle" font-size="22" fill="#854D0E">结构冒险</text><text x="215" y="183" text-anchor="middle" font-size="18" fill="#475569">两个阶段争用同一硬件</text><text x="215" y="218" text-anchor="middle" font-size="18" fill="#166534">增资源 / 错开 / 停顿</text><rect x="430" y="100" width="320" height="150" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="590" y="140" text-anchor="middle" font-size="22" fill="#1E40AF">数据冒险</text><text x="590" y="183" text-anchor="middle" font-size="18" fill="#475569">后指令依赖前结果</text><text x="590" y="218" text-anchor="middle" font-size="18" fill="#166534">转发 / 停顿 / 调度</text><rect x="805" y="100" width="320" height="150" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="3"/><text x="965" y="140" text-anchor="middle" font-size="22" fill="#991B1B">控制冒险</text><text x="965" y="183" text-anchor="middle" font-size="18" fill="#475569">分支目标尚未确定</text><text x="965" y="218" text-anchor="middle" font-size="18" fill="#166534">预测 / 延迟 / 冲刷</text><text x="55" y="305" font-size="19" fill="#475569">流水线提升吞吐率，但冒险处理会插入气泡或改变后续取指。</text></svg>
