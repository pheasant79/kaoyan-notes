<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect width="760" height="220" fill="#fff"/><text x="380" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">文件访问对象关系</text><g font-size="14" text-anchor="middle"><rect x="35" y="80" width="130" height="55" fill="#eff6ff" stroke="#2563eb"/><text x="100" y="113">路径/文件名</text><rect x="220" y="80" width="130" height="55" fill="#f5f3ff" stroke="#7c3aed"/><text x="285" y="113">目录项</text><rect x="405" y="80" width="130" height="55" fill="#fef3c7" stroke="#d97706"/><text x="470" y="113">inode / FCB</text><rect x="590" y="80" width="135" height="55" fill="#f0fdf4" stroke="#16a34a"/><text x="657" y="113">数据块</text></g><path d="M165 108 H215" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M350 108 H400" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M535 108 H585" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="380" y="175" text-anchor="middle" font-size="12" fill="#64748b">目录把名称映射到控制信息，控制信息再定位文件物理块</text><text x="380" y="198" text-anchor="middle" font-size="12" fill="#dc2626">目录项不是文件数据本身</text></svg>
