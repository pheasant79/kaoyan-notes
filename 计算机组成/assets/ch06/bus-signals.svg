<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">总线三类信号</title><desc id="desc">地址、数据和控制总线承担不同职责。</desc><rect width="1120" height="360" fill="#FFFFFF"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G6-01 总线信号分工</text><rect x="75" y="95" width="280" height="100" rx="8" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><text x="215" y="140" text-anchor="middle" font-size="24" fill="#854D0E">地址总线</text><text x="215" y="170" text-anchor="middle" font-size="17" fill="#475569">定位访问对象</text><rect x="420" y="95" width="280" height="100" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="560" y="140" text-anchor="middle" font-size="24" fill="#166534">数据总线</text><text x="560" y="170" text-anchor="middle" font-size="17" fill="#475569">传送指令、操作数、结果</text><rect x="765" y="95" width="280" height="100" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="3"/><text x="905" y="140" text-anchor="middle" font-size="24" fill="#991B1B">控制总线</text><text x="905" y="170" text-anchor="middle" font-size="17" fill="#475569">读写、时序、响应、中断</text><text x="75" y="275" font-size="20" fill="#475569">地址回答“哪里”，数据回答“什么”，控制回答“何时、如何传”。</text><text x="75" y="315" font-size="18" fill="#B91C1C">不同教材对控制线名称可能略有差异，以题目给出的信号定义为准。</text></svg>
