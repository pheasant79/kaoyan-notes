<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#64748b"/></marker>
  </defs>
  <rect width="980" height="300" fill="#ffffff"/>
  <text x="490" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb">IP 数据报逐跳转发</text>
  <g font-size="14" text-anchor="middle">
    <rect x="38" y="82" width="145" height="78" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="108" font-weight="700">源主机</text>
    <text x="110" y="132">IP 192.168.1.10</text>
    <text x="110" y="151">MAC A</text>
    <rect x="245" y="82" width="145" height="78" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="318" y="108" font-weight="700">路由器 R1</text>
    <text x="318" y="132">查路由表</text>
    <text x="318" y="151">下一跳 R2</text>
    <rect x="452" y="82" width="145" height="78" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="525" y="108" font-weight="700">路由器 R2</text>
    <text x="525" y="132">TTL 减 1</text>
    <text x="525" y="151">重新封装</text>
    <rect x="659" y="82" width="145" height="78" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="732" y="108" font-weight="700">路由器 R3</text>
    <text x="732" y="132">继续查表</text>
    <text x="732" y="151">送往目标网</text>
    <rect x="842" y="82" width="105" height="78" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="894" y="108" font-weight="700">目标主机</text>
    <text x="894" y="132">目标 IP</text>
    <text x="894" y="151">MAC Z</text>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <line x1="183" y1="121" x2="238" y2="121"/>
      <line x1="390" y1="121" x2="445" y2="121"/>
      <line x1="597" y1="121" x2="652" y2="121"/>
      <line x1="804" y1="121" x2="835" y2="121"/>
    </g>
    <text x="210" y="105" fill="#64748b">帧 1</text>
    <text x="417" y="105" fill="#64748b">帧 2</text>
    <text x="624" y="105" fill="#64748b">帧 3</text>
  </g>
  <rect x="92" y="205" width="796" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="490" y="229" text-anchor="middle" font-size="14" fill="#1e293b">端到端保持：源 IP、目的 IP</text>
  <text x="490" y="250" text-anchor="middle" font-size="14" fill="#dc2626">逐跳变化：链路层帧、下一跳 MAC；TTL 每经过路由器通常减 1</text>
</svg>
