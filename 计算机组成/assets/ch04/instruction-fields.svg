<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc"><title id="title">指令字段拆解</title><desc id="desc">操作码、寻址方式和地址字段组成指令字。</desc><rect width="1100" height="300" fill="#FFFFFF"/><text x="40" y="42" font-size="28" fill="#1E3A8A" font-weight="700">G4-01 一条指令由哪些字段组成</text><rect x="65" y="105" width="260" height="75" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><rect x="325" y="105" width="220" height="75" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><rect x="545" y="105" width="490" height="75" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text x="195" y="150" text-anchor="middle" font-size="22" fill="#1E40AF">操作码：做什么</text><text x="435" y="150" text-anchor="middle" font-size="22" fill="#854D0E">方式：怎么找</text><text x="790" y="150" text-anchor="middle" font-size="22" fill="#166534">地址/寄存器字段：对谁做</text><text x="65" y="235" font-size="19" fill="#475569">字段划分由指令字长、地址码数量和 ISA 约定决定；同一操作码可配不同寻址方式。</text></svg>
