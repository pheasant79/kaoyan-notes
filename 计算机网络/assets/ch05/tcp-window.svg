<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <rect width="900" height="300" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb">TCP 字节序号与发送窗口</text>
  <text x="68" y="103" font-size="14">字节序号</text>
  <g font-size="13" text-anchor="middle">
    <rect x="150" y="72" width="150" height="58" fill="#f8fafc" stroke="#cbd5e1"/><text x="225" y="96">已确认</text><text x="225" y="117">ACK 前</text>
    <rect x="300" y="72" width="250" height="58" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="425" y="96" font-weight="700">已发送但未确认</text><text x="425" y="117">在途字节</text>
    <rect x="550" y="72" width="210" height="58" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="655" y="96" font-weight="700">可发送范围</text><text x="655" y="117">窗口内未发送</text>
    <rect x="760" y="72" width="95" height="58" fill="#f8fafc" stroke="#cbd5e1"/><text x="807" y="96">窗口外</text><text x="807" y="117">暂不可发</text>
  </g>
  <line x1="300" y1="146" x2="300" y2="170" stroke="#64748b"/><line x1="760" y1="146" x2="760" y2="170" stroke="#64748b"/>
  <text x="300" y="190" text-anchor="middle" font-size="12" fill="#64748b">发送基点</text><text x="760" y="190" text-anchor="middle" font-size="12" fill="#64748b">窗口右边界</text>
  <rect x="180" y="220" width="540" height="48" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="450" y="250" text-anchor="middle" font-size="14">有效发送窗口受 min(rwnd, cwnd) 约束</text>
  <text x="450" y="289" text-anchor="middle" font-size="12" fill="#64748b">rwnd 保护接收方；cwnd 保护网络</text>
</svg>
